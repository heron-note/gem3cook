  <title>👂 モスキート音・高周波可聴域チェッカー</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='👂 モスキート音・高周波可聴域チェッカー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var curAge=40;var curFreq=15000;var isPlaying=false;var actx=null;function getAudioContext(){if(!actx){var AC=w.AudioContext||w.webkitAudioContext;if(AC){actx=new AC();}}if(actx&&actx.state==='suspended'){actx.resume();}return actx;}function playClickSound(){try{var ac=getAudioContext();if(!ac)return;var osc=ac.createOscillator();var g=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,ac.currentTime);g.gain.setValueAtTime(0.05,ac.currentTime);g.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.04);osc.connect(g);g.connect(ac.destination);osc.start();osc.stop(ac.currentTime+0.05);}catch(e){}}function getLimit(a){return Math.max(8000,Math.min(20000,Math.round(20000-(a-15)*200)));}function formatNum(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}var title=d.createElement('div');title.textContent='👂 モスキート音・高周波可聴域チェッカー';title.style.cssText='color:#38bdf8;font-size:20px;font-weight:bold;text-align:center;';card.appendChild(title);var subTitle=d.createElement('div');subTitle.textContent='耳の経年変化なのかスピーカーの物理限界なのかを科学する';subTitle.style.cssText='color:#94a3b8;font-size:12px;text-align:center;margin-top:-6px;margin-bottom:4px;';card.appendChild(subTitle);var opBox=d.createElement('div');opBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(opBox);var ageLabel=d.createElement('div');ageLabel.style.cssText='font-size:13px;color:#f8fafc;font-weight:bold;';opBox.appendChild(ageLabel);var ageSlider=d.createElement('input');ageSlider.type='range';ageSlider.min='10';ageSlider.max='80';ageSlider.step='1';ageSlider.value='40';ageSlider.style.cssText='cursor:pointer;accent-color:#38bdf8;';opBox.appendChild(ageSlider);var presetRow=d.createElement('div');presetRow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;';opBox.appendChild(presetRow);var presets=[8000,12000,15000,17000,19000];var presetLabels=['8kHz','12kHz','15kHz','17kHz','19kHz'];for(var i=0;i<presets.length;i++){(function(f,lbl){var btn=d.createElement('button');btn.textContent=lbl;btn.style.cssText='flex:1;min-width:54px;padding:6px 0;background-color:#1e293b;border:1px solid #475569;border-radius:6px;color:#f8fafc;font-size:12px;cursor:pointer;font-weight:bold;';btn.onclick=function(){playClickSound();curFreq=f;freqSlider.value=f.toString();update();};presetRow.appendChild(btn);})(presets[i],presetLabels[i]);}var freqLabel=d.createElement('div');freqLabel.style.cssText='font-size:13px;color:#f8fafc;font-weight:bold;';opBox.appendChild(freqLabel);var freqSlider=d.createElement('input');freqSlider.type='range';freqSlider.min='8000';freqSlider.max='20000';freqSlider.step='500';freqSlider.value='15000';freqSlider.style.cssText='cursor:pointer;accent-color:#0284c7;';opBox.appendChild(freqSlider);var toneBtn=d.createElement('button');toneBtn.textContent='🔊 指定周波数をテスト発振（1秒間）';toneBtn.style.cssText='background-color:#0284c7;border:none;border-radius:8px;padding:12px;color:#ffffff;font-size:14px;font-weight:bold;cursor:pointer;transition:background-color 0.2s;';opBox.appendChild(toneBtn);var monBox=d.createElement('div');monBox.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(monBox);var monTop=d.createElement('div');monTop.style.cssText='display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;';monBox.appendChild(monTop);var freqDisplay=d.createElement('div');freqDisplay.style.cssText='color:#38bdf8;font-size:32px;font-weight:bold;line-height:1;';monTop.appendChild(freqDisplay);var bandDisplay=d.createElement('div');bandDisplay.style.cssText='color:#f8fafc;font-size:14px;font-weight:bold;background-color:#1e293b;padding:4px 8px;border-radius:4px;border:1px solid #475569;';monTop.appendChild(bandDisplay);var gridBox=d.createElement('div');gridBox.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;background-color:#1e293b;padding:10px;border-radius:6px;';monBox.appendChild(gridBox);var gAge=d.createElement('div');gAge.style.cssText='color:#cbd5e1;';gridBox.appendChild(gAge);var gLimit=d.createElement('div');gLimit.style.cssText='color:#cbd5e1;';gridBox.appendChild(gLimit);var gCurFreq=d.createElement('div');gCurFreq.style.cssText='color:#cbd5e1;';gridBox.appendChild(gCurFreq);var gLoud=d.createElement('div');gLoud.textContent='等ラウドネス影響: 感度急減（ISO 226）';gLoud.style.cssText='color:#94a3b8;';gridBox.appendChild(gLoud);var warnNote=d.createElement('div');warnNote.textContent='※本ツールの数値は教育的シミュレーションであり、実際の聴覚機能を示すものではありません。';warnNote.style.cssText='font-size:11px;color:#94a3b8;';monBox.appendChild(warnNote);var expPanel=d.createElement('div');expPanel.textContent='【耳の限界か、スピーカーの限界か】高音が聞こえない場合、内耳の有毛細胞の経年変化だけでなく、スマホやPCの内蔵スピーカーが高周波域を十分に再生できていない可能性があります。また、ISO 226（等ラウドネス曲線）の通り高音ほど人間には小さく知覚されますが、聞こえないからと端末の音量を最大にするとスピーカー破損や聴覚への過大負荷につながります。聞こえなくても深追いせず、機器と耳をいたわりましょう。';expPanel.style.cssText='background-color:#1e293b;border-left:4px solid #38bdf8;border-radius:6px;padding:12px;font-size:11px;line-height:1.6;color:#cbd5e1;';card.appendChild(expPanel);var copyBtn=d.createElement('button');copyBtn.textContent='📋 観測結果をコピー';copyBtn.style.cssText='background-color:#334155;border:none;border-radius:8px;padding:10px;color:#ffffff;font-size:12px;font-weight:bold;cursor:pointer;';card.appendChild(copyBtn);function update(){var lim=getLimit(curAge);ageLabel.textContent='現在の設定年齢: '+curAge+'歳 / モデル参考上限: '+formatNum(lim)+' Hz';freqLabel.textContent='テスト周波数手動調整: '+formatNum(curFreq)+' Hz';freqDisplay.textContent=formatNum(curFreq)+' Hz';var bText='';if(curFreq<=10000){bText='日常会話・生活音域';}else if(curFreq<=14000){bText='高周波域（楽器の倍音等）';}else if(curFreq<=17000){bText='モスキート音域（若年層ほど検知しやすい帯域）';}else{bText='超高周波域（知覚・再生ともに条件が極めて厳しい帯域）';}bandDisplay.textContent=bText;gAge.textContent='設定年齢モデル: '+curAge+'歳';gLimit.textContent='モデル参考上限: '+formatNum(lim)+' Hz';gCurFreq.textContent='現在の周波数: '+formatNum(curFreq)+' Hz';}ageSlider.oninput=function(){curAge=parseInt(ageSlider.value,10);playClickSound();update();};freqSlider.oninput=function(){curFreq=parseInt(freqSlider.value,10);playClickSound();update();};toneBtn.onclick=function(){if(isPlaying)return;try{var ac=getAudioContext();if(!ac)return;isPlaying=true;toneBtn.textContent='再生中...';toneBtn.style.backgroundColor='#d97706';var osc=ac.createOscillator();var g=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(curFreq,ac.currentTime);g.gain.setValueAtTime(0.18,ac.currentTime);g.gain.setValueAtTime(0.18,ac.currentTime+0.95);g.gain.linearRampToValueAtTime(0.0001,ac.currentTime+1.0);osc.connect(g);g.connect(ac.destination);osc.start();osc.stop(ac.currentTime+1.0);w.setTimeout(function(){isPlaying=false;toneBtn.textContent='🔊 指定周波数をテスト発振（1秒間）';toneBtn.style.backgroundColor='#0284c7';},1000);}catch(e){isPlaying=false;toneBtn.textContent='🔊 指定周波数をテスト発振（1秒間）';toneBtn.style.backgroundColor='#0284c7';}};copyBtn.onclick=function(){var lim=getLimit(curAge);var text='【高周波音響チェック】老人の日にテスト周波数'+formatNum(curFreq)+'Hzを発振（年齢モデル：'+curAge+'歳 / 参考上限：'+formatNum(lim)+'Hz）。聞こえない原因が耳なのかスピーカーの限界なのかは物理の闇の中。 #老人の日 #モスキート音チェッカー #音響物理';var copied=false;var ta=d.createElement('textarea');ta.readOnly=true;ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;opacity:0;font-size:16px;z-index:-1;';d.body.appendChild(ta);try{ta.focus();ta.setSelectionRange(0,ta.value.length);copied=d.execCommand('copy');}catch(err){}d.body.removeChild(ta);if(!copied&&w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){try{w.navigator.clipboard.writeText(text);copied=true;}catch(err){}}copyBtn.textContent='✔ 結果をコピー完了！';copyBtn.style.backgroundColor='#059669';w.setTimeout(function(){copyBtn.textContent='📋 観測結果をコピー';copyBtn.style.backgroundColor='#334155';},1500);};update();})();
  </script>
