xt='padding:12px;background-color:#1e293b;border-left:4px solid #64748b;border-radius:6px;font-size:12px;line-height:1.6;color:#94a3b8;';noteBox.textContent='【科学的事実と仮想モデルの区別】空気の飽和水蒸気量は温度が高いほど増加し、暖房で暖まり水蒸気を含んだ室内空気が冷えた窓ガラス等の表面に触れて露点温度を下回ると凝縮・結露が生じます。実際の発生は表面温度・断熱性能・湿度・気流に依存します。なお、本ツールの数値(Pt)とランク判定は日常の結露ジレンマを楽しむためのジョーク用仮想モデルであり、実測や伝熱計算ではありません。';card.appendChild(noteBox);function updateResult(){var scoreNum=Math.min(999,Math.round(20+hours*26+heat_level*45));var dew_score=scoreNum+' Pt';hourVal.textContent=hours+' 時間';scoreEl.textContent=dew_score;var j;for(j=0;j<btns.length;j++){if(j===heat_level){btns[j].style.cssText='padding:10px 12px;border-radius:8px;border:2px solid #38bdf8;background-color:#0284c7;color:#ffffff;font-size:13px;text-align:left;cursor:pointer;font-weight:700;';}else{btns[j].style.cssText='padding:10px 12px;border-radius:8px;border:1px solid #475569;background-color:#1e293b;color:#cbd5e1;font-size:13px;text-align:left;cursor:pointer;font-weight:600;';}}var rank='';var msg='';var col='#38bdf8';if(scoreNum<160){rank='ランクA: 理性的な熱平衡エリア';msg='換気と温度管理のバランスが良好です。窓ガラスもまだ平静を保っており、デスク周りの紙類が波打つ気配はありません。';col='#4ade80';}else if(scoreNum<300){rank='ランクB: じわじわ露点接近フェーズ';msg='快適さの裏で窓際の空気は静かに冷やされています。サッシの隅にうっすら水滴の気配が出始める頃合いです。短い換気が効きます。';col='#facc15';}else if(scoreNum<440){rank='ランクC: 窓ガラス凝縮アクアリウム警報';msg='暖房と密閉のコンボで水蒸気の逃げ場が失われつつあります。窓辺に置いた機器やカーテンが湿気の洗礼を受ける前に空気を入れ替えましょう。';col='#fb923c';}else{rank='ランクD: 物理法則の容赦ない結露瀑布';msg='暖かさと湿度を極めた結果、冷えた窓面が全力で水蒸気を液体へ還元しています。自然の熱力学には勝てないため、素直な換気と拭き取りが賢明です。';col='#f87171';}rankEl.textContent=rank;rankEl.style.color=col;commentEl.textContent=msg;}function bindBtn(idx){btns[idx].onclick=function(){heat_level=idx;updateResult();};}var k;for(k=0;k<btns.length;k++){bindBtn(k);}slider.oninput=function(){hours=parseInt(slider.value,10);updateResult();};updateResult();})();void(0);
