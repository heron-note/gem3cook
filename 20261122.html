  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='♨️ 熱力学・温浴熱移動＆のぼせ崩壊アナライザー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var tempLevel=1;var minutes=20;var tempNames=['ぬるめ・38度前後','標準・40度前後','熱々・43度超のガチ湯モード'];var h1=d.createElement('h1');h1.textContent='♨️ 熱力学・温浴熱移動＆のぼせ崩壊アナライザー';h1.style.cssText='margin:0;font-size:20px;line-height:1.35;color:#f8fafc;font-weight:700;';card.appendChild(h1);var sub=d.createElement('div');sub.textContent='浴槽内の熱伝導・対流と発汗・浸透圧調節を学ぶ、晩秋の長湯リスク仮想診断';sub.style.cssText='font-size:13px;color:#94a3b8;line-height:1.4;';card.appendChild(sub);var secTemp=d.createElement('div');secTemp.style.cssText='display:flex;flex-direction:column;gap:8px;padding:12px;background-color:#0f172a;border-radius:12px;border:1px solid #334155;';card.appendChild(secTemp);var lblTemp=d.createElement('div');lblTemp.textContent='1. 湯温設定を選択';lblTemp.style.cssText='font-size:13px;font-weight:700;color:#cbd5e1;';secTemp.appendChild(lblTemp);var btnWrap=d.createElement('div');btnWrap.style.cssText='display:grid;grid-templa .appendChild(resRank);var resMsg=d.createElement('div');resMsg.style.cssText='font-size:13px;line-height:1.55;color:#cbd5e1;';resBox.appendChild(resMsg);var noteBox=d.createElement('div');noteBox.style.cssText='padding:12px;background-color:#172554;border:1px solid #1d4ed8;border-radius:10px;display:flex;flex-direction:column;gap:6px;';card.appendChild(noteBox);var noteTitle=d.createElement('div');noteTitle.textContent='科学的メモ（事実とジョーク判定の分離）';noteTitle.style.cssText='font-size:12px;font-weight:700;color:#93c5fd;';noteBox.appendChild(noteTitle);var noteBody=d.createElement('div');noteBody.textContent='【原理】浴槽では湯の熱伝導と対流により体表面から深部へ熱が移動し、体温上昇に応じて発汗が進みます。長湯で水分と電解質が失われると体液の浸透圧バランスが崩れやすく、血管拡張による血圧変動も重なってのぼせや立ちくらみを招きます。【注意】上記の指数とランクは長湯のジレンマを楽しむためのジョーク仮想モデルであり、実際の医学的・生理学的測定値ではありません。';noteBody.style.cssText='font-size:12px;line-height:1.55;color:#dbeafe;';noteBox.appendChild(noteBody);function updateButtons(){var i;for(i=0;i<btns.length;i++){if(i===tempLevel){btns[i].style.cssText='padding:10px 12px;border-radius:8px;border:1px solid #38bdf8;background-color:#0284c7;color:#ffffff;font-size:13px;font-weight:700;text-align:left;cursor:pointer;';}else{btns[i].style.cssText='padding:10px 12px;border-radius:8px;border:1px solid #334155;background-color:#1e293b;color:#cbd5e1;font-size:13px;font-weight:400;text-align:left;cursor:pointer;';}}}function updateResult(){var score=Math.min(999,Math.round(20+minutes*12+tempLevel*45));valTime.textContent=minutes+'分';resScore.textContent=score+' Pt';var rank='';var msg='';var col='#38bdf8';if(score<180){rank='ランクS：理性の温浴エリート';msg='熱移動と発汗のバランスが優雅に保たれています。湯冷めする前に水分補給をして撤収できる勝ち組です。';col='#4ade80';}else if(score<340){rank='ランクA：そろそろ長湯フラグ点灯';msg='気持ちよさに負けて滞在時間が伸び始めています。対流熱がじわじわ効いてきた頃合いです。一度湯船の縁で休憩を。';col='#facc15';}else if(score<520){rank='ランクB：のぼせ予備軍・浸透圧ピンチ';msg='発汗による水分と電解質の消耗が進行中。あと5分だけという甘い囁きが、脱衣所での立ちくらみフラグになります。';col='#fb923c';}else{rank='ランクC：熱力学の敗北・ゆでだこ崩壊圏';msg='温浴というより低温調理の領域に突入しています。見栄や元を取る精神は捨て、即座に上がって水と塩分を補給してください。';col='#f87171';}resScore.style.color=col;resRank.textContent=rank+'（'+tempNames[tempLevel]+' / '+minutes+'分）';resMsg.textContent=msg;updateButtons();}btn0.onclick=function(){tempLevel=0;updateResult();};btn1.onclick=function(){tempLevel=1;updateResult();};btn2.onclick=function(){tempLevel=2;updateResult();};slider.oninput=function(){minutes=parseInt(slider.value,10);updateResult();};slider.onchange=function(){minutes=parseInt(slider.value,10);updateResult();};updateResult();})();void(0);
