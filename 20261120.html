isp.style.cssText='font-size:18px;font-weight:bold;color:#fbbf24;';rankDisp.textContent='ランク: ---';resultBox.appendChild(rankDisp);var descDisp=d.createElement('div');descDisp.style.cssText='margin-top:12px;font-size:12px;color:#cbd5e1;text-align:left;line-height:1.5;';descDisp.textContent='';resultBox.appendChild(descDisp);function updateBtnStyles(){btn0.style.backgroundColor=fabric_level===0?'#2563eb':'#334155';btn1.style.backgroundColor=fabric_level===1?'#2563eb':'#334155';btn2.style.backgroundColor=fabric_level===2?'#2563eb':'#334155';}function calculate(){var shock_score=Math.min(999,Math.round(25+(60-humidity)*20+fabric_level*40));scoreDisp.textContent=shock_score+' Pt';var rankText='';var descText='';if(shock_score<200){rankText='安全圏 (Safe)';descText='人体への電荷蓄積は限定的です。金属に接近した際の絶縁破壊・スパーク放電リスクは低く抑えられています。';}else if(shock_score<600){rankText='警戒圏 (Warning)';descText='摩擦帯電により電子が蓄積し始めています。アースされたドアノブ等に触れると微細な放電が生じるリスクがあります。';}else{rankText='危険圏 (Danger)';descText='過剰な電子が帯電しています。金属へ接近した瞬間に空気の絶縁破壊を引き起こし、痛みを伴う強力なスパーク放電が発生する可能性が極めて高いです。';}rankDisp.textContent='状態ランク判定: '+rankText;descDisp.textContent='【メカニズム注記】 '+descText+' (※本結果は静電気ショックのジレンマを楽しむジョーク用の仮想モデルです)';}btn0.onclick=function(){fabric_level=0;updateBtnStyles();calculate();};btn1.onclick=function(){fabric_level=1;updateBtnStyles();calculate();};btn2.onclick=function(){fabric_level=2;updateBtnStyles();calculate();};humSlider.oninput=function(){humidity=parseInt(humSlider.value,10);humValue.textContent=humidity;calculate();};updateBtnStyles();calculate();})();void(0);
