<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧦 タイツ見栄とガクブル演出シミュレーター</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🧦 タイツ見栄とガクブル演出シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var title=d.createElement('div');title.style.cssText='color:#38bdf8;font-size:18px;font-weight:bold;text-align:center;';title.textContent='🧦 薄手タイツの見栄と木枯らしガクブル演出シミュレーター';card.appendChild(title);var sub=d.createElement('div');sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;';sub.textContent='被服伝熱の境界層コラムと見栄っ張り防寒のジョークモデル';card.appendChild(sub);var denier=40;var wind_v=6;var audioCtx=null;function playBeep(freq){try{var Ctx=w.AudioContext||w.webkitAudioContext;if(!Ctx)return;if(!audioCtx)audioCtx=new Ctx();if(audioCtx.state==='suspended')audioCtx.resume();var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq||660,audioCtx.currentTime);gain.gain.setValueAtTime(0.08,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.07);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.07);}catch(e){}}var ctrlBox=d.createElement('div');ctrlBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(ctrlBox);var dLabel=d.createElement('div');dLabel.style.cssText='font-size:13px;font-weight:bold;color:#cbd5e1;';dLabel.textContent='1. 着用デニール選択（見栄 vs 防寒）';ctrlBox.appendChild(dLabel);var btnGrid=d.createElement('div');btnGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';ctrlBox.appendChild(btnGrid);var dOpts=[{v:20,t:'20D 透け感特化'},{v:40,t:'40D 見栄張り薄手'},{v:80,t:'80D 標準'},{v:160,t:'160D 重装甲'}];var btns=[];function makeBtn(opt){var b=d.createElement('button');b.textContent=opt.t;b.onclick=function(){denier=opt.v;playBeep(opt.v===20?880:(opt.v===40?740:(opt.v===80?580:440)));updateUI();};btnGrid.appendChild(b);btns.push({b:b,v:opt.v});}for(var i=0;i<dOpts.length;i++){makeBtn(dOpts[i]);}var wHeader=d.createElement('div');wHeader.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:4px;';ctrlBox.appendChild(wHeader);var wLabel=d.createElement('div');wLabel.style.cssText='font-size:13px;font-weight:bold;color:#cbd5e1;';wLabel.textContent='2. 木枯らし風速スライダー';wHeader.appendChild(wLabel);var wVal=d.createElement('div');wVal.style.cssText='font-size:14px;font-weight:bold;color:#38bdf8;';wHeader.appendChild(wVal);var slider=d.createElement('input');slider.type='range';slider.min='0';slider.max='12';slider.step='1';slider.value='6';slider.style.cssText='cursor:pointer;accent-color:#38bdf8;';slider.oninput=function(){wind_v=parseInt(slider.value,10);playBeep(440+wind_v*35);updateUI();};ctrlBox.appendChild(slider);var monBox=d.createElement('div');monBox.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(monBox);var rankLabel=d.createElement('div');rankLabel.style.cssText='font-size:14px;font-weight:bold;color:#facc15;text-align:center;';monBox.appendChild(rankLabel);var scoreLabel=d.createElement('div');scoreLabel.style.cssText='font-size:30px;font-weight:bold;color:#f8fafc;text-align:center;';monBox.appendChild(scoreLabel);var statGrid=d.createElement('div');statGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;';monBox.appendChild(statGrid);function createStatCard(titleText){var box=d.createElement('div');box.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;';var t=d.createElement('div');t.style.cssText='font-size:11px;color:#94a3b8;';t.textContent=titleText;var v=d.createElement('div');v.style.cssText='font-size:13px;font-weight:bold;color:#f8fafc;';box.appendChild(t);box.appendChild(v);statGrid.appendChild(box);return v;}var valTorihada=createStatCard('鳥肌ボツボツ演出度');var valMippari=createStatCard('見栄っ張りレベル');var valKaze=createStatCard('風抜けスースー演出');var valFace=createStatCard('表情の余裕');var note=d.createElement('div');note.style.cssText='font-size:10px;color:#64748b;margin-top:4px;line-height:1.4;';note.textContent='※本ツールの計算式・数値・判定はすべてジョーク用の仮想モデル（演出）であり、実際の熱抵抗（clo値）や生体温度を測定・予測するものではありません。';monBox.appendChild(note);var colBox=d.createElement('div');colBox.style.cssText='background-color:#1e293b;border-left:4px solid #38bdf8;border-radius:6px;padding:12px 11px;font-size:11px;line-height:1.6;color:#cbd5e1;';colBox.textContent='【被服気候学の仕組みと日常の皮肉】デニールは糸の線密度（9000mあたりのグラム数）を表す単位です。衣服の保温性には生地が保持する静止空気層が大きく関わりますが、実際の熱抵抗（clo値）や防風性は編み組織の密度や着用時の伸張率、素材条件にも依存します。一般に網目の粗い薄手の生地では、風が吹くと強制対流熱伝達および網目からの通気によって表面の暖かい空気層が奪われ、放熱が促進されます。『厚ぼったく見えるのは嫌！』と見栄を張って薄手で木枯らしに飛び出した結果、待っているのは歯の根が合わないガクブル体験です。見栄を捨てて暖かい装備を選びましょう。';card.appendChild(colBox);function updateUI(){for(var i=0;i<btns.length;i++){var item=btns[i];if(item.v===denier){item.b.style.cssText='background-color:#0284c7;color:#f8fafc;border:1px solid #38bdf8;border-radius:6px;padding:8px;font-size:12px;font-weight:bold;cursor:pointer;';}else{item.b.style.cssText='background-color:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;padding:8px;font-size:12px;font-weight:normal;cursor:pointer;';}}wVal.textContent='風速: '+wind_v+' m/s';var vuln=denier==20?2.5:(denier==40?1.8:(denier==80?1.0:0.4));var wind_factor=1+Math.pow(wind_v,1.4)*0.8;var gakuburu_score=Math.min(999,Math.round(25*vuln*wind_factor));var torihada_pt=Math.min(100,Math.round(gakuburu_score*0.22));var rankText='';var rankColor='#facc15';if(gakuburu_score<60){rankText='✨ 判定: ぬくぬく防寒（実用性重視の勝利）';rankColor='#4ade80';}else if(gakuburu_score>=60&&gakuburu_score<160){rankText='🍃 判定: しのびよる冷気（足元のスースー感）';rankColor='#38bdf8';}else if(gakuburu_score>=160&&gakuburu_score<320){rankText='⚡ 判定: 鳥肌ボツボツ警報（見栄の代償）';rankColor='#facc15';}else{rankText='⚠️ 判定: 極寒ガクブル氷結ランク（見栄っ張りの自爆）';rankColor='#f87171';}rankLabel.textContent=rankText;rankLabel.style.color=rankColor;scoreLabel.textContent='ガクブル演出スコア: '+gakuburu_score+' pt';valTorihada.textContent=torihada_pt+' pt';valMippari.textContent=denier==20?'極限の意地と美学':(denier==40?'意地でも薄手':(denier==80?'バランス派':'堅実・防寒最優先'));valKaze.textContent=gakuburu_score<60?'しっかりブロック':(gakuburu_score<160?'隙間からスースー':(gakuburu_score<320?'冷風貫通モード':'極寒暴風直撃'));valFace.textContent=gakuburu_score<60?'余裕の笑顔':(gakuburu_score<160?'少し引きつり笑い':(gakuburu_score<320?'小刻みに震える':'歯の根が合わない'));}updateUI();})();
  </script>
</body>
</html>
