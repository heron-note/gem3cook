  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;if(!w){return;}var d=w.document;var b=d.body;b.style.cssText='margin:0;padding:24px 16px;background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;box-sizing:border-box;min-height:100vh;';var c=d.createElement('div');c.style.cssText='width:100px;max-width:540px;width:100px;width:100vw;max-width:520px;background:#1e293b;border-radius:16px;padding:24px;border:1px solid #334155;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;';b.appendChild(c);var t=d.createElement('div');t.textContent='📜 休息権宣言採決機';t.style.cssText='font-size:20px;font-weight:bold;color:#f59e0b;text-align:center;';c.appendChild(t);var sub=d.createElement('div');sub.textContent='不可侵なる個人の休息権を満場一致で採択する';sub.style.cssText='font-size:13px;color:#94a3b8;text-align:center;margin-top:-8px;';c.appendChild(sub);var bill=d.createElement('div');bill.textContent='議案：活動の即時停止および不可侵なる個人の休息権に関する宣言';bill.style.cssText='background:#0f172a;padding:12px 14px;border-radius:8px;font-size:13px;border-left:4px solid #f59e0b;color:#cbd5e1;line-height:1.5;';c.appendChild(bill);var mon=d.createElement('div');mon.style.cssText='background:#0f172a;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid #334155;';c.appendChild(mon);var counts=d.createElement('div');counts.style.cssText='display:flex;justify-content:space-around;text-align:center;';mon.appendChild(counts);var yBox=d.createElement('div');var yLbl=d.createElement('div');yLbl.textContent='賛成票 (POUR)';yLbl.style.cssText='font-size:12px;color:#22c55e;font-weight:bold;';var yNum=d.createElement('div');yNum.textContent='0';yNum.style.cssText='font-size:32px;font-weight:bold;font-family:monospace;color:#22c55e;margin-top:4px;';yBox.appendChild(yLbl);yBox.appendChild(yNum);counts.appendChild(yBox);var nBox=d.createElement('div');var nLbl=d.createElement('div');nLbl.textContent='反対票 (CONTRE)';nLbl.style.cssText='font-size:12px;color:#ef4444;font-weight:bold;';var nNum=d.createElement('div');nNum.textContent='0';nNum.style.cssText='font-size:32px;font-weight:bold;font-family:monospace;color:#ef4444;margin-top:4px;';nBox.appendChild(nLbl);nBox.appendChild(nNum);counts.appendChild(nBox);var rail=d.createElement('div');rail.style.cssText='width:100px;width:100vw;max-width:100vw;width:auto;height:12px;background:#334155;border-radius:6px;overflow:hidden;position:relative;';mon.appendChild(rail);var bar=d.createElement('div');bar.style.cssText='height:12px;width:0px;background:#22c55e;border-radius:6px;transition:width 0.04s ease;';rail.appendChild(bar);var status=d.createElement('div');status.textContent='待機中：議場定足数 1200名';status.style.cssText='text-align:center;font-size:13px;color:#94a3b8;font-weight:bold;';mon.appendChild(status);var actBtn=d.createElement('button');actBtn.textContent='⚖️ 国民議会で採決を開始';actBtn.style.cssText='background:#f59e0b;color:#0f172a;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;';c.appendChild(actBtn);var dec=d.createElement('div');dec.style.cssText='display:none;background:#451a03;border:1px solid #f59e0b;border-radius:12px;padding:16px;color:#fef08a;font-size:13px;line-height:1.6;flex-direction:column;gap:8px;';c.appendChild(dec);var dHead=d.createElement('div');dHead.textContent='【可決条文】休息権の不可侵宣言';dHead.style.cssText='font-weight:bold;font-size:14px;color:#f59e0b;border-bottom:1px solid #78350f;padding-bottom:6px;margin-bottom:4px;';dec.appendChild(dHead);var a1=d.createElement('div');a1.textContent='第1条［休息の自由］：人は生まれながらにして自由であり、活動終了を宣言した後は何人からも作業を強制されない。';dec.appendChild(a1);var a2=d.createElement('div');a2.textContent='第2条［抵抗権］：以後の通知や残余タスクに対し、人はこれを平穏に後回しにする自然権を有する。';dec.appendChild(a2);var a3=d.createElement('div');a3.textContent='第3条［時間の主権］：以後の時間の用途は、完全に個人の完全休息および回復に存する。';dec.appendChild(a3);var cpBtn=d.createElement('button');cpBtn.textContent='📋 宣言文を布告・コピー';cpBtn.style.cssText='display:none;background:#22c55e;color:#0f172a;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;';c.appendChild(cpBtn);function playAudio(){try{var AC=w.AudioContext||w.webkitAudioContext;if(!AC){return;}var ctx=new AC();function gavel(t){var osc=ctx.createOscillator();var g=ctx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(140,t);osc.frequency.exponentialRampToValueAtTime(30,t+0.12);g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.12);osc.connect(g);g.connect(ctx.destination);osc.start(t);osc.stop(t+0.13);}gavel(ctx.currentTime);gavel(ctx.currentTime+0.14);gavel(ctx.currentTime+0.28);function note(f,t,d){var osc=ctx.createOscillator();var g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);osc.connect(g);g.connect(ctx.destination);osc.start(t);osc.stop(t+d+0.05);}var st=ctx.currentTime+0.45;note(523.25,st,0.18);note(659.25,st+0.12,0.18);note(783.99,st+0.24,0.18);note(1046.50,st+0.36,0.6);note(659.25,st+0.36,0.6);note(783.99,st+0.36,0.6);}catch(e){}}function copyFallback(txt){var ta=d.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';b.appendChild(ta);ta.focus();ta.setSelectionRange(0,txt.length);var res=false;try{res=d.execCommand('copy');}catch(err){}b.removeChild(ta);return res;}actBtn.onclick=function(){actBtn.style.display='none';var cur=0;var total=1200;var railW=rail.clientWidth||300;var timer=w.setInterval(function(){cur=cur+150;if(cur>total){cur=total;}yNum.textContent=cur;var ratio=cur/total;bar.style.width=(railW*ratio)+'px';if(cur>=total){w.clearInterval(timer);status.textContent='🎉 満場一致（全会一致）で可決！';status.style.color='#22c55e';playAudio();dec.style.display='flex';cpBtn.style.display='block';}},40);};cpBtn.onclick=function(){var txt='【休息権宣言採決】国民議会において休息権が全会一致（賛成1200票・反対0票）で可決されました。第1条：人は活動終了後において完全に自由である。これより全活動を停止します。 #休息権宣言 #人権宣言採決';if(w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){w.navigator.clipboard.writeText(txt)['then'](function(){cpBtn.textContent='✨ 布告完了（クリップボードにコピー済）';cpBtn.style.background='#10b981';})['catch'](function(){if(copyFallback(txt)){cpBtn.textContent='✨ 布告完了（クリップボードにコピー済）';cpBtn.style.background='#10b981';}else{cpBtn.textContent='❌ コピー失敗';}});}else{if(copyFallback(txt)){cpBtn.textContent='✨ 布告完了（クリップボードにコピー済）';cpBtn.style.background='#10b981';}else{cpBtn.textContent='❌ コピー失敗';}}};})();
  </script>
