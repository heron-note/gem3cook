<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏮 境界の夜・ランタンと温もりのお茶会</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🏮 境界の夜・ランタンと温もりのお茶会';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0b0f19;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0b0f19;';var card=d.createElement('div');card.style.cssText='background-color:#161f30;border:1px solid #2d3b55;border-radius:16px;box-shadow:0 15px 35px rgba(0,0,0,0.7);width:100vw;max-width:580px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;';body.appendChild(card);var tit=d.createElement('div');tit.style.cssText='font-size:22px;font-weight:bold;color:#f59e0b;letter-spacing:1px;';tit.textContent='🏮 境界の夜';card.appendChild(tit);var sub=d.createElement('div');sub.style.cssText='font-size:13px;color:#94a3b8;margin-top:-10px;';sub.textContent='十月最後の夜・名も知らぬ旅人とのひととき';card.appendChild(sub);var lamp=d.createElement('div');lamp.style.cssText='width:60px;height:60px;border-radius:30px;background-color:#f59e0b;box-shadow:0 0 25px #d97706;transition:all 0.6s ease;';card.appendChild(lamp);var story=d.createElement('div');story.style.cssText='background-color:#0b0f19;border:1px solid #2d3b55;border-radius:10px;padding:18px;width:100vw;max-width:520px;box-sizing:border-box;line-height:1.8;font-size:14px;color:#e2e8f0;text-align:left;min-height:110px;';card.appendChild(story);var btn=d.createElement('button');btn.style.cssText='background-color:#2d3b55;color:#f8fafc;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:bold;outline:none;';card.appendChild(btn);var phase=0;var texts=['冷え込む宵闇の帳が下りる頃、軒先に古いランタンを掲げる。風のざわめきと共に、境界の彼方から外套をまとった見知らぬ旅人が静かに歩み寄ってきた。','パチパチと爆ぜる暖炉のそば、湯気を立てる温かなかぼちゃのスープを分け合う。言葉を交わさずとも、器を持つ手からじんわりと互いの温もりが伝わっていく。','熾火が穏やかに息づき、夜の気配が薄れ始める。旅人は静かに立ち上がり、闇の境へと背を向けた。「また来年」。残された器には、確かな温もりが宿っている。'];var btnTexts=['旅人を招き入れる','静かにスープを分ける','見送り、火を落とす'];var glowStyles=['background-color:#f59e0b;box-shadow:0 0 30px #d97706;','background-color:#fbbf24;box-shadow:0 0 35px #f59e0b;','background-color:#b45309;box-shadow:0 0 16px #78350f;'];function playWarmTone(){try{var AC=w.AudioContext||w.webkitAudioContext;if(!AC)return;var actx=new AC();var osc1=actx.createOscillator();var osc2=actx.createOscillator();var gain=actx.createGain();osc1.type='sine';osc2.type='sine';osc1.frequency.setValueAtTime(440,actx.currentTime);osc2.frequency.setValueAtTime(554.37,actx.currentTime);gain.gain.setValueAtTime(0.04,actx.currentTime);gain.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.1);osc1.connect(gain);osc2.connect(gain);gain.connect(actx.destination);osc1.start();osc2.start();osc1.stop(actx.currentTime+0.1);osc2.stop(actx.currentTime+0.1);}catch(e){}}function render(){story.textContent=texts[phase];btn.textContent=btnTexts[phase];lamp.style.cssText='width:60px;height:60px;border-radius:30px;transition:all 0.6s ease;'+glowStyles[phase];}btn.onclick=function(){playWarmTone();phase=(phase+1);if(phase>2){phase=0;}render();};render();})();
  </script>
</body>
</html>
