  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🚰 管路工学・圧力損失＆配管閉塞アナライザー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var state={oil:0,year:3};var title=d.createElement('h1');title.style.cssText='font-size:20px;font-weight:bold;color:#38bdf8;text-align:center;margin:0;';title.textContent='🚰 管路工学・圧力損失＆配管閉塞アナライザー';card.appendChild(title);var subtitle=d.createElement('div');subtitle.style.cssText='font-size:12px;color:#94a3b8;text-align:center;margin-bottom:10px;';subtitle.textContent='日々の小さな油断から学ぶ流体抵抗の増大メカニズム';card.appendChild(subtitle);var oilLabel=d.createElement('div');oilLabel.style.cssText='font-size:14px;font-weight:bold;color:#e2e8f0;margin-top:10px;';oilLabel.textContent='排水時の油分流入度選択';card.appendChild(oilLabel);var btnContainer=d.createElement('div');btnContainer.style.cssText='display:flex;flex-direction:column;gap:8px;';card.appendChild(btnContainer);var btn0=d.createElement('button');btn0.textContent='完全に油を拭き取っている (0)';var btn1=d.createElement('button');btn1.textContent='たまにそのまま流す (1)';var btn2=d.createElement('button');btn2.textContent='揚げ油の残りも直行 (2)';var btns=[btn0,btn1,btn2];for(var i=0;i<btns.length;i++){btns[i].style.cssText='padding:10px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;transition:all 0.2s;';btnContainer.appendChild(btns[i]);}var yearLabelContainer=d.createElement('div');yearLabelContainer.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:10px;';card.appendChild(yearLabelContainer);var yearLabel=d.createElement('div');yearLabel.style.cssText='font-size:14px;font-weight:bold;color:#e2e8f0;';yearLabel.textContent='配管使用年数: ';yearLabelContainer.appendChild(yearLabel);var yearVal=d.createElement('div');yearVal.style.cssText='font-size:16px;font-weight:bold;color:#fbbf24;';yearLabelContainer.appendChild(yearVal);var slider=d.createElement('input');slider.type='range';slider.min='1';slider.max='10';slider.value='3';slider.style.cssText='width:280px;margin:10px 0;';card.appendChild(slider);var resBox=d.createElement('div');resBox.style.cssText='background-color:#0f172a;border:2px solid #475569;border-radius:12px;padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:10px;';card.appendChild(resBox);var resScore=d.createElement('div');resScore.style.cssText='font-size:24px;font-weight:bold;color:#f87171;text-align:center;';resBox.appendChild(resScore);var resRank=d.createElement('div');resRank.style.cssText='font-size:16px;font-weight:bold;color:#cbd5e1;text-align:center;';resBox.appendChild(resRank);var resNoteTitle=d.createElement('div');resNoteTitle.style.cssText='font-size:12px;color:#94a3b8;border-top:1px solid #334155;padding-top:10px;margin-top:10px;';resNoteTitle.textContent='【管路摩擦と圧力損失の解説】';resBox.appendChild(resNoteTitle);var resNote=d.createElement('div');resNote.style.cssText='font-size:12px;color:#94a3b8;line-height:1.5;';resBox.appendChild(resNote);function updateUI(){var v=parseInt(slider.value,10);state.year=v;yearVal.textContent=v+' 年';for(var j=0;j<btns.length;j++){if(j===state.oil){btns[j].style.backgroundColor='#38bdf8';btns[j].style.color='#0f172a';}else{btns[j].style.backgroundColor='#334155';btns[j].style.color='#cbd5e1';}}var score=Math.min(999,Math.round(20+state.year*25+state.oil*40));resScore.textContent='配管閉塞危機指数: '+score+' Pt';if(score<100){resRank.textContent='ランクA: 健全な層流状態。美しい管路です。';resRank.style.color='#4ade80';}else if(score<150){resRank.textContent='ランクB: やや抵抗増大。粗度係数に影響あり。';resRank.style.color='#facc15';}else if(score<200){resRank.textContent='ランクC: 圧力損失が顕著。通水能力低下中。';resRank.style.color='#fb923c';}else{resRank.textContent='ランクD: 閉塞の危機。有効断面積が枯渇。';resRank.style.color='#ef4444';}resNote.textContent='油脂の堆積は管壁の粗さを増大させ、摩擦係数を悪化させます。有効断面積の縮小は流速上昇と圧力損失（ダルシー・ワイスバッハの式に基づく抵抗）を招き、最終的に流路を閉塞させます。※本ツールは配管の経年変化とメンテナンスの重要性を楽しむためのジョーク用の仮想判定モデルです。実際の配管設計予測式ではありません。';}btn0.onclick=function(){state.oil=0;updateUI();};btn1.onclick=function(){state.oil=1;updateUI();};btn2.onclick=function(){state.oil=2;updateUI();};slider.oninput=function(){updateUI();};updateUI();})();void(0);
