  <title>📺 網膜分解能・4K/8K視認限界距離アナライザー</title>

  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='📺 網膜分解能・4K/8K視認限界距離アナライザー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var tBox=d.createElement('div');tBox.style.cssText='text-align:center;display:flex;flex-direction:column;gap:4px;';card.appendChild(tBox);var title=d.createElement('div');title.style.cssText='color:#38bdf8;font-size:20px;font-weight:bold;';title.textContent='📺 網膜分解能・4K/8K視認限界距離アナライザー';tBox.appendChild(title);var subTitle=d.createElement('div');subTitle.style.cssText='color:#94a3b8;font-size:12px;';subTitle.textContent='ハイビジョンの日に解き明かす超高精細ディスプレイの幾何光学';tBox.appendChild(subTitle);var actx=null;function beep(){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(!actx)return;if(actx.state==='suspended')actx.resume();var osc=actx.createOscillator();var g=actx.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,actx.currentTime);g.gain.setValueAtTime(0.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.08);osc.connect(g);g.connect(actx.destination);osc.start();osc.stop(actx.currentTime+0.08);}catch(e){}}var ctrlBox=d.createElement('div');ctrlBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(ctrlBox);var btnRow=d.createElement('div');btnRow.style.cssText='display:flex;gap:8px;';ctrlBox.appendChild(btnRow);var curRes=3840;var resBtns=[];function createResBtn(label,val){var b=d.createElement('button');b.textContent=label;b.style.cssText='flex:1;padding:8px;border-radius:6px;border:none;font-weight:bold;cursor:pointer;background-color:#334155;color:#f8fafc;font-size:13px;';b.onclick=function(){curRes=val;updateBtnState();beep();update();};btnRow.appendChild(b);resBtns.push({btn:b,val:val});}createResBtn('FHD',1920);createResBtn('4K',3840);createResBtn('8K',7680);function updateBtnState(){for(var i=0;i<resBtns.length;i++){if(resBtns[i].val===curRes){resBtns[i].btn.style.backgroundColor='#0284c7';}else{resBtns[i].btn.style.backgroundColor='#334155';}}}function createSlider(labelPrefix,min,max,step,val,unit){var wrap=d.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:4px;font-size:12px;color:#cbd5e1;';var row=d.createElement('div');row.style.cssText='display:flex;justify-content:space-between;';var lTxt=d.createElement('span');lTxt.textContent=labelPrefix;row.appendChild(lTxt);var vTxt=d.createElement('span');vTxt.style.cssText='font-weight:bold;color:#38bdf8;';vTxt.textContent=val+unit;row.appendChild(vTxt);wrap.appendChild(row);var inp=d.createElement('input');inp.type='range';inp.min=min;inp.max=max;inp.step=step;inp.value=val;inp.style.cssText='width:100%;cursor:pointer;';wrap.appendChild(inp);ctrlBox.appendChild(wrap);return{inp:inp,vTxt:vTxt,unit:unit};}var sSize=createSlider('画面サイズ: ',24,100,1,55,' インチ');var sVis=createSlider('視力: ',0.5,2.0,0.1,1.0,'');var sDist=createSlider('視聴距離: ',0.5,4.0,0.1,2.0,' m');var monBox=d.createElement('div');monBox.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(monBox);var stLabel=d.createElement('div');stLabel.style.cssText='font-size:16px;font-weight:bold;';monBox.appendChild(stLabel);var limLabel=d.createElement('div');limLabel.style.cssText='font-size:32px;font-weight:bold;color:#38bdf8;line-height:1.2;';monBox.appendChild(limLabel);var grid=d.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:#94a3b8;background-color:#1e293b;padding:8px;border-radius:6px;';monBox.appendChild(grid);var g1=d.createElement('div');grid.appendChild(g1);var g2=d.createElement('div');grid.appendChild(g2);var g3=d.createElement('div');grid.appendChild(g3);var g4=d.createElement('div');grid.appendChild(g4);var note=d.createElement('div');note.style.cssText='font-size:11px;color:#64748b;';note.textContent='※幾何光学上の計算値であり、コントラストや脳内画像補正は含みません。';monBox.appendChild(note);var rep=d.createElement('div');rep.style.cssText='background-color:#1e293b;border-left:4px solid #38bdf8;border-radius:6px;padding:12px;font-size:11px;line-height:1.6;color:#cbd5e1;';rep.textContent='【幾何光学の逆転と親の小言】人間の視力1.0の角分解能は1分角（約0.0167度）です。リビングの標準的な距離（約2m）において55インチ画面を見る場合、8Kの1画素は視力1.0の最小分解角を大きく下回るため、通常の視聴距離から1画素単位の高精細さを個別識別することはできません。同じ画面サイズなら解像度を上げるほど、その細かさを1画素単位で味わうにはむしろ画面に異常接近（55インチ8Kなら約55cm）しなければならないという逆転が生じます。テレビから離れて見なさい。';card.appendChild(rep);function update(){var dInch=parseFloat(sSize.inp.value);var v=parseFloat(sVis.inp.value);var lView=parseFloat(sDist.inp.value);sSize.vTxt.textContent=dInch+sSize.unit;sVis.vTxt.textContent=v.toFixed(1)+sVis.unit;sDist.vTxt.textContent=lView.toFixed(1)+sDist.unit;var dMm=dInch*25.4;var wMm=dMm*(16/Math.sqrt(337));var pMm=wMm/curRes;var thetaRad=(1/v)*(1/60)*(Math.PI/180);var lLimit=(pMm/1000)/Math.tan(thetaRad);var ppi=curRes/(wMm/25.4);var arcmin=(1/v).toFixed(2);limLabel.textContent='画素識別限界: '+lLimit.toFixed(2)+' m';g1.textContent='画素ピッチ: '+pMm.toFixed(3)+' mm';g2.textContent='画面密度: '+ppi.toFixed(1)+' ppi';g3.textContent='最小分解角: '+arcmin+' 分角';g4.textContent='現在の視距離: '+lView.toFixed(1)+' m';if(lView<=lLimit){stLabel.style.color='#34d399';stLabel.textContent='画素識別可能域（1画素単位の粒立ちを知覚可能な至近距離）';}else{stLabel.style.color='#38bdf8';stLabel.textContent='光学融合域（画素が視力最小分解角を下回り、滑らかに連続融合）';}}sSize.inp.oninput=function(){beep();update();};sVis.inp.oninput=function(){beep();update();};sDist.inp.oninput=function(){beep();update();};updateBtnState();update();})();
  </script>
