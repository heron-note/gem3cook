Row);var gaugeHeader=d.createElement('div');gaugeHeader.style.cssText='display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-top:2px;';var gaugeTitle=d.createElement('span');gaugeTitle.textContent='耐力負荷比 (対限界値)';var gaugeRatioVal=d.createElement('span');gaugeRatioVal.style.cssText='font-weight:bold;color:#22c55e;';gaugeRatioVal.textContent='負荷比 0 pt';gaugeHeader.appendChild(gaugeTitle);gaugeHeader.appendChild(gaugeRatioVal);monitorBox.appendChild(gaugeHeader);var gaugeTrack=d.createElement('div');gaugeTrack.style.cssText='background-color:#1e293b;border-radius:4px;height:10px;width:100%;overflow:hidden;position:relative;border:1px solid #334155;box-sizing:border-box;';var gaugeFill=d.createElement('div');gaugeFill.style.cssText='height:100%;width:0px;background-color:#22c55e;border-radius:3px;';gaugeTrack.appendChild(gaugeFill);monitorBox.appendChild(gaugeTrack);var reportPanel=d.createElement('div');reportPanel.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;color:#cbd5e1;font-size:11px;line-height:1.6;box-sizing:border-box;';card.appendChild(reportPanel);function calc(){var v=parseFloat(vSlider.value);var p=parseFloat(pSlider.value);var m=models[currentModelIdx];var rho=1.205*(p/1013.25);var q=0.5*rho*v*v;var fd=m.cd*q*m.a;var fKg=fd/9.80665;var loadRatioPt=(fd/m.limit)*100;var ratioBarRatio=Math.min(fd/m.limit,1.0);loadVal.textContent=fKg.toFixed(1)+' kgf / '+Math.round(fd)+' N';qVal.textContent='ベルヌーイ動圧 (q): '+Math.round(q)+' Pa';rhoVal.textContent='空気密度 (rho): '+rho.toFixed(3)+' kg/m3';gaugeRatioVal.textContent='負荷比 '+Math.round(loadRatioPt)+' pt (耐力: '+m.limit+' N)';var trackWidth=gaugeTrack.clientWidth||gaugeTrack.offsetWidth||400;var fillPx=Math.round(trackWidth*ratioBarRatio);gaugeFill.style.width=fillPx+'px';var barColor='#22c55e';if(loadRatioPt>=100){barColor='#ef4444';gaugeRatioVal.style.color='#ef4444';}else if(loadRatioPt>=60){barColor='#eab308';gaugeRatioVal.style.color='#eab308';}else{barColor='#22c55e';gaugeRatioVal.style.color='#22c55e';}gaugeFill.style.backgroundColor=barColor;var repText='';if(m.id==='human'){repText='【力学モデル設定】成人直立（投影面積: '+m.a.toFixed(2)+' m2, Cd: '+m.cd.toFixed(2)+', 靴底静止摩擦限界: '+m.limit+' N / 約'+m.limitKg+' kgf）。';if(loadRatioPt>=100){repText=repText+' 【最大静止摩擦力突破】風圧抗力が靴底の静止摩擦限界（'+m.limit+' N）を超過。この剛体仮定では足元が滑走し、自力直立の維持が力学的に不可能です。（※現実の人間は前傾姿勢や踏ん張りで抗えます）';}else if(loadRatioPt>=60){repText=repText+' 【姿勢制御注意】抗力が約'+Math.round(fd)+' Nに達し、通常歩行でのバランス維持が著しく困難な警戒領域です。';}else{repText=repText+' 【安定域】流体抗力は摩擦限界内であり、直立状態を保持可能な負荷範囲です。';}}else if(m.id==='umbrella'){repText='【力学モデル設定】ビニール傘（受風面積: '+m.a.toFixed(2)+' m2, Cd: '+m.cd.toFixed(2)+', 骨組座屈限界: '+m.limit+' N / 約'+m.limitKg+' kgf）。';if(loadRatioPt>=100){repText=repText+' 【骨組座屈限界突破】流体抗力がモデル骨組み耐力（'+m.limit+' N）を超過。おちょこ化または不可逆な骨折破壊が発生する領域です。（※設定した簡易力学モデルによる計算値です）';}else if(loadRatioPt>=60){repText=repText+' 【変形警戒領域】抗力が約'+Math.round(fd)+' Nに達し、傘骨が大きくしなり手元保持に強い腕力を要します。';}else{repText=repText+' 【保持可能域】骨組みの弾性限界内であり、正常な開傘状態を維持可能です。';}}else if(m.id==='window'){repText='【力学モデル設定】居室窓ガラス1枚（受圧面積: '+m.a.toFixed(2)+' m2, Cd: '+m.cd.toFixed(2)+', 許容設計風圧限界: '+m.limit+' N / 約'+m.limitKg+' kgf）。';if(loadRatioPt>=100){repText=repText+' 【許容設計風圧突破】風圧荷重が設計許容値（'+m.limit+' N）を超過。瞬間的な強風や飛来物衝撃によるガラス破損の危険性が極めて高い領域です。（※設定した簡易力学モデルによる計算値です）';}else if(loadRatioPt>=60){repText=repText+' 【高負荷領域】風圧荷重が約'+Math.round(fd)+' Nに達し、サッシのたわみや風鳴りが発生する警戒水準です。';}else{repText=repText+' 【設計耐力内】作用する風圧荷重は許容範囲内に収まっています。';}}reportPanel.textContent=repText;}w.onresize=function(){calc();};calc();})();
