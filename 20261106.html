<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>🎯 独立試行シミュレーター</title>

  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🎯 独立試行シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var titleEl=d.createElement('h1');titleEl.textContent='🎯 独立試行シミュレーター・ガチ回転ルーレット誤謬チェッカー';titleEl.style.cssText='font-size:18px;margin:0;color:#38bdf8;';card.appendChild(titleEl);var themeLabel=d.createElement('div');themeLabel.textContent='決断テーマ選択:';themeLabel.style.cssText='font-size:14px;color:#94a3b8;';card.appendChild(themeLabel);var themeSelect=d.createElement('select');themeSelect.style.cssText='background-color:#0f172a;color:#f8fafc;border:1px solid #334155;padding:8px;border-radius:8px;font-size:14px;';var opt0=d.createElement('option');opt0.value='0';opt0.textContent='面倒な連絡を誰にするか';themeSelect.appendChild(opt0);var opt1=d.createElement('option');opt1.value='1';opt1.textContent='夕飯のメニュー選定';themeSelect.appendChild(opt1);var opt2=d.createElement('option');opt2.value='2';opt2.textContent='人生の重大な選択のフリ';themeSelect.appendChild(opt2);card.appendChild(themeSelect);var cylinderContainer=d.createElement('div');cylinderContainer.style.cssText='position:relative;width:200px;height:200px;margin:0 auto;background:#0f172a;border-radius:50%;border:4px solid #334155;display:flex;justify-content:center;align-items:center;';card.appendChild(cylinderContainer);var chambers=[];var radius=70;var centerX=100;var centerY=100;for(var i=0;i<6;i++){var angle=(i*60)*(Math.PI/180);var x=centerX+radius*Math.cos(angle)-15;var y=centerY+radius*Math.sin(angle)-15;var ch=d.createElement('div');ch.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:30px;height:30px;border-radius:50%;background:#334155;border:2px solid #64748b;display:flex;justify-content:center;align-items:center;font-size:12px;color:#f8fafc;font-weight:bold;';ch.textContent=i+1;cylinderContainer.appendChild(ch);chambers.push(ch);}var btnContainer=d.createElement('div');btnContainer.style.cssText='display:flex;gap:10px;justify-content:center;';card.appendChild(btnContainer);var spinBtn=d.createElement('button');spinBtn.textContent='🔄 ルーレットを回す';spinBtn.style.cssText='background-color:#2563eb;color:#f8fafc;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;';btnContainer.appendChild(spinBtn);var resultCard=d.createElement('div');resultCard.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;';card.appendChild(resultCard);var resultText=d.createElement('div');resultText.textContent='結果: まだ回転していません';resultCard.appendChild(resultText);var illusionText=d.createElement('div');illusionText.textContent='錯覚生存指数: 83.3 pt';resultCard.appendChild(illusionText);var promptLabel=d.createElement('div');promptLabel.textContent='生成プロンプト:';promptLabel.style.cssText='color:#94a3b8;font-size:12px;';resultCard.appendChild(promptLabel);var promptBox=d.createElement('div');promptBox.style.cssText='background-color:#1e293b;border:1px solid #334155;padding:8px;border-radius:6px;font-family:monospace;font-size:11px;word-break:break-all;';promptBox.textContent='（ここにルーレット結果に応じたプロンプトが表示されます）';resultCard.appendChild(promptBox);var copyBtn=d.createElement('button');copyBtn.textContent='📋 プロンプトをコピー';copyBtn.style.cssText='background-color:#334155;color:#f8fafc;border:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:bold;';resultCard.appendChild(copyBtn);var colCard=d.createElement('div');colCard.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-size:12px;color:#94a3b8;display:flex;flex-direction:column;gap:6px;';card.appendChild(colCard);var colTitle=d.createElement('div');colTitle.textContent='📖 科学コラム: 独立試行とギャンブラーの誤謬';colTitle.style.cssText='color:#38bdf8;font-weight:bold;';colCard.appendChild(colTitle);var colContent=d.createElement('div');colContent.textContent='独立試行とは、過去の結果が未来の結果に一切影響を与えない性質です。しかし人間は「そろそろ当たりが出るはずだ」と錯覚するギャンブラーの誤謬に陥りがちです。このツールは、その数学的真実と心理的バイアスのギャップをジョークとして楽しむものです。';colCard.appendChild(colContent);var trialCount=0;var currentPromptStr='';function updateResult(stoppedIndex){if(stoppedIndex===undefined){resultText.textContent='結果: まだ回転していません';illusionText.textContent='錯覚生存指数: 83.3 pt';promptBox.textContent='（ここにルーレット結果に応じたプロンプトが表示されます）';return;}trialCount++;var selectedChamber=stoppedIndex+1;var hit=(selectedChamber===1);for(var i=0;i<chambers.length;i++){if(i===stoppedIndex){chambers[i].style.backgroundColor='#ef4444';chambers[i].style.borderColor='#f87171';}else{chambers[i].style.backgroundColor='#334155';chambers[i].style.borderColor='#64748b';}}var themeVal=themeSelect.value;var themeName='面倒な連絡';if(themeVal==='1') themeName='夕飯のメニュー';if(themeVal==='2') themeName='重大な選択';var outcomeText=hit? ' -> 【当たり/実行】': ' -> 【ハズレ/回避】';resultText.textContent='テーマ['+themeName+'] 試行回数:'+trialCount+'回目 -> チャンバー:'+selectedChamber+outcomeText;var score=Math.round(83.3-(trialCount*2.5));if(score<10) score=10;illusionText.textContent='錯覚生存指数: '+score+' pt';var promptType=(stoppedIndex%4)+1;if(promptType===1){currentPromptStr='ショートエッセイ用プロンプト: ロシアンルーレットと確率の皮肉を描く500字の随筆を生成してください。科学的事実である独立試行とギャンブラーの誤謬、およびゲーム的演出を明確に区別してください。';}else if(promptType===2){currentPromptStr='超短編小説用プロンプト: 確率に運命を委ねた男の短いドラマを生成してください。科学的事実である独立試行とギャンブラーの誤謬、およびゲーム的演出を明確に区別してください。';}else if(promptType===3){currentPromptStr='短歌用プロンプト: 独立試行と人間の思い込みを詠んだ三十一文字を生成してください。科学的事実である独立試行とギャンブラーの誤謬、およびゲーム的演出を明確に区別してください。';}else{currentPromptStr='ポエム用プロンプト: 冷徹な数学と気まぐれな運命を綴る詩を生成してください。科学的事実である独立試行とギャンブラーの誤謬、およびゲーム的演出を明確に区別してください。';}promptBox.textContent=currentPromptStr;}spinBtn.onclick=function(){spinBtn.disabled=true;var currentIndex=Math.floor(Math.random()*6);var totalSteps=18+Math.floor(Math.random()*6);var currentStep=0;var delay=50;function stepAnim(){for(var i=0;i<chambers.length;i++){chambers[i].style.backgroundColor='#334155';}chambers[currentIndex].style.backgroundColor='#3b82f6';currentIndex=(currentIndex+1)%6;currentStep++;if(currentStep<totalSteps){delay+=15;setTimeout(stepAnim,delay);}else{var finalIndex=(currentIndex+5)%6;updateResult(finalIndex);spinBtn.disabled=false;}}stepAnim();};copyBtn.onclick=function(){if(!currentPromptStr){return;}navigator.clipboard.writeText(currentPromptStr).then(function(){copyBtn.textContent='✅ プロンプトをコピー完了！';setTimeout(function(){copyBtn.textContent='📋 プロンプトをコピー';},2000);});};updateResult();})();
  </script>
