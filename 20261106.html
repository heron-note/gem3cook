<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 独立試行シミュレーター</title>
</head>

  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🎯 独立試行シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:600px;max-width:100vw;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var titleEl=d.createElement('h1');titleEl.textContent='🎯 独立試行シミュレーター・ギャグ的ルーレット誤謬チェッカー';titleEl.style.cssText='font-size:18px;margin:0;color:#38bdf8;';card.appendChild(titleEl);var themeLabel=d.createElement('div');themeLabel.textContent='決断テーマ選択:';themeLabel.style.cssText='font-size:14px;color:#94a3b8;';card.appendChild(themeLabel);var themeSelect=d.createElement('select');themeSelect.style.cssText='background-color:#0f172a;color:#f8fafc;border:1px solid #334155;padding:8px;border-radius:8px;font-size:14px;';var opt0=d.createElement('option');opt0.value='0';opt0.textContent='面倒な連絡を誰にするか';themeSelect.appendChild(opt0);var opt1=d.createElement('option');opt1.value='1';opt1.textContent='夕飯のメニュー選定';themeSelect.appendChild(opt1);var opt2=d.createElement('option');opt2.value='2';opt2.textContent='人生の重大な選択のフリ';themeSelect.appendChild(opt2);card.appendChild(themeSelect);var cylinderContainer=d.createElement('div');cylinderContainer.style.cssText='position:relative;width:200px;height:200px;margin:0 auto;background:#0f172a;border-radius:50%;border:4px solid #334155;display:flex;justify-content:center;align-items:center;';card.appendChild(cylinderContainer);var chambers=[];var radius=70;var centerX=100;var centerY=100;for(var i=0;i<6;i++){var angle=(i*60)*(Math.PI/180);var x=centerX+radius*Math.cos(angle)-15;var y=centerY+radius*Math.sin(angle)-15;var ch=d.createElement('div');ch.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:30px;height:30px;border-radius:50%;background:#334155;border:2px solid #64748b;display:flex;justify-content:center;align-items:center;font-size:12px;color:#f8fafc;font-weight:bold;';ch.textContent=i+1;cylinderContainer.appendChild(ch);chambers.push(ch);}var btnContainer=d.createElement('div');btnContainer.style.cssText='display:flex;gap:10px;justify-content:center;';card.appendChild(btnContainer);var spinBtn=d.createElement('button');spinBtn.textContent='🔄 シリンダーを回転して決断';spinBtn.style.cssText='background-color:#2563eb;color:#f8fafc;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;';btnContainer.appendChild(spinBtn);var resultCard=d.createElement('div');resultCard.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;';card.appendChild(resultCard);var resultText=d.createElement('div');resultText.textContent='結果: まだ回転していません';resultCard.appendChild(resultText);var illusionText=d.createElement('div');illusionText.textContent='錯覚生存指数: 83.3 pt';resultCard.appendChild(illusionText);var promptLabel=d.createElement('div');promptLabel.textContent='生成プロンプト:';promptLabel.style.cssText='color:#94a3b8;font-size:12px;';resultCard.appendChild(promptLabel);var promptBox=d.createElement('div');promptBox.style.cssText='background-color:#1e293b;border:1px solid #334155;padding:8px;border-radius:6px;font-family:monospace;font-size:11px;word-break:break-all;';var promptStr='確率論における独立試行の不変性と、人間が陥るギャンブラーの誤謬（認知バイアス）の科学的背景を踏まえ、不確実な日常の決断を確率に委ねる人間の滑稽さと数学の冷徹な真実について深く考察するエッセイを生成してください。';promptBox.textContent=promptStr;resultCard.appendChild(promptBox);var copyBtn=d.createElement('button');copyBtn.textContent='📋 プロンプトをコピー';copyBtn.style.cssText='background-color:#334155;color:#f8fafc;border:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:bold;';resultCard.appendChild(copyBtn);var colCard=d.createElement('div');colCard.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-size:12px;color:#94a3b8;display:flex;flex-direction:column;gap:6px;';card.appendChild(colCard);var colTitle=d.createElement('div');colTitle.textContent='📖 科学コラム: 独立試行とギャンブラーの誤謬';colTitle.style.cssText='color:#38bdf8;font-weight:bold;';colCard.appendChild(colTitle);var colContent=d.createElement('div');colContent.textContent='独立試行とは、過去の結果が未来の結果に一切影響を与えない性質です。しかし人間は「そろそろ当たりが出るはずだ」と錯覚するギャンブラーの誤謬に陥りがちです。このツールは、その数学的真実と心理的バイアスのギャップをジョークとして楽しむものです。';colCard.appendChild(colContent);var trialCount=0;function updateResult(){if(trialCount===0){resultText.textContent='結果: まだ回転していません';illusionText.textContent='錯覚生存指数: 83.3 pt';return;}var selectedChamber=Math.floor(Math.random()*6)+1;var hit=(selectedChamber===1);for(var i=0;i<chambers.length;i++){if(i+1===selectedChamber){chambers[i].style.backgroundColor='#ef4444';chambers[i].style.borderColor='#f87171';}else{chambers[i].style.backgroundColor='#334155';chambers[i].style.borderColor='#64748b';}}var themeVal=themeSelect.value;var themeName='面倒な連絡';if(themeVal==='1') themeName='夕飯のメニュー';if(themeVal==='2') themeName='重大な選択';var outcomeText=hit? ' -> 【当たり/実行】': ' -> 【ハズレ/回避】';resultText.textContent='テーマ['+themeName+'] 試行回数:'+trialCount+'回目 -> チャンバー:'+selectedChamber+outcomeText;var score=Math.round(83.3-(trialCount*2.5));if(score<10) score=10;illusionText.textContent='錯覚生存指数: '+score+' pt';}spinBtn.onclick=function(){trialCount++;var count=0;var interval=setInterval(function(){var rand=Math.floor(Math.random()*6);for(var i=0;i<chambers.length;i++){if(i===rand){chambers[i].style.backgroundColor='#3b82f6';}else{chambers[i].style.backgroundColor='#334155';}}count++;if(count>6){clearInterval(interval);updateResult();}},50);};copyBtn.onclick=function(){navigator.clipboard.writeText(promptStr).then(function(){copyBtn.textContent='✅ コピー完了！';setTimeout(function(){copyBtn.textContent='📋 プロンプトをコピー';},2000);});};updateResult();})();
  </script>
