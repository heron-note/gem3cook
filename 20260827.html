<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var b=d.body;b.style.cssText='margin:0;padding:20px;background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;';var c=d.createElement('div');c.style.cssText='width:600px;background:#1e293b;border-radius:12px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);box-sizing:border-box;';b.appendChild(c);var t=d.createElement('div');t.textContent='🌡️ 地表熱収支＆放射冷却アナライザー';t.style.cssText='color:#38bdf8;font-size:18px;font-weight:bold;margin-bottom:4px;';c.appendChild(t);var sub=d.createElement('div');sub.textContent='地表と宇宙空間の熱フラックス平衡（W/m2）を可視化する';sub.style.cssText='color:#94a3b8;font-size:12px;margin-bottom:14px;';c.appendChild(sub);var p=d.createElement('div');p.style.cssText='background:#0f172a;border-radius:8px;padding:12px;margin-bottom:14px;box-sizing:border-box;';c.appendChild(p);function createRow(labelText){var row=d.createElement('div');row.style.cssText='margin-bottom:10px;';var lbl=d.createElement('div');lbl.textContent=labelText;lbl.style.cssText='font-size:12px;color:#94a3b8;margin-bottom:4px;';row.appendChild(lbl);p.appendChild(row);return row;}var rTime=createRow('時刻設定 (0〜24時)');var slTime=d.createElement('input');slTime.type='range';slTime.min='0';slTime.max='24';slTime.step='0.5';slTime.value='14';slTime.style.cssText='width:460px;vertical-align:middle;cursor:pointer;';rTime.appendChild(slTime);var valTime=d.createElement('span');valTime.style.cssText='font-size:12px;color:#38bdf8;font-weight:bold;margin-left:10px;';rTime.appendChild(valTime);var rCloud=createRow('雲量設定 (0:快晴 〜 10:曇天)');var slCloud=d.createElement('input');slCloud.type='range';slCloud.min='0';slCloud.max='10';slCloud.step='1';slCloud.value='1';slCloud.style.cssText='width:460px;vertical-align:middle;cursor:pointer;';rCloud.appendChild(slCloud);var valCloud=d.createElement('span');valCloud.style.cssText='font-size:12px;color:#38bdf8;font-weight:bold;margin-left:10px;';rCloud.appendChild(valCloud);var rSur=createRow('地表タイプ（アルベド）選択');var currentAlb=0.20;var surTypes=[{name:'🌿 芝生 (0.20)',alb:0.20},{name:'🛣️ アスファルト (0.08)',alb:0.08},{name:'❄️ 新雪 (0.70)',alb:0.70}];var btns=[];for(var i=0;i<surTypes.length;i++){(function(idx){var btn=d.createElement('button');btn.textContent=surTypes[idx].name;btn.style.cssText='margin-right:8px;padding:6px 12px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#cbd5e1;';btn.onclick=function(){currentAlb=surTypes[idx].alb;for(var j=0;j<btns.length;j++){btns[j].style.background='#1e293b';btns[j].style.borderColor='#334155';btns[j].style.color='#cbd5e1';}btn.style.background='#38bdf8';btn.style.borderColor='#38bdf8';btn.style.color='#0f172a';calc();};rSur.appendChild(btn);btns.push(btn);})(i);}btns[0].style.background='#38bdf8';btns[0].style.borderColor='#38bdf8';btns[0].style.color='#0f172a';var mon=d.createElement('div');mon.style.cssText='background:#0f172a;border:1px solid #38bdf8;border-radius:8px;padding:12px;margin-bottom:14px;box-sizing:border-box;';c.appendChild(mon);var grid=d.createElement('div');grid.style.cssText='display:flex;justify-content:space-between;margin-bottom:12px;';mon.appendChild(grid);function createItem(title,col){var box=d.createElement('div');box.style.cssText='width:125px;background:#1e293b;padding:8px;border-radius:6px;box-sizing:border-box;text-align:center;';var l=d.createElement('div');l.textContent=title;l.style.cssText='font-size:10px;color:#94a3b8;margin-bottom:4px;';box.appendChild(l);var v=d.createElement('div');v.style.cssText='font-size:14px;font-weight:bold;color:'+col+';';box.appendChild(v);grid.appendChild(box);return v;}var vRs=createItem('吸収日射 Rs_net','#fbbf24');var vLd=createItem('大気逆放射 L_down','#a78bfa');var vLu=createItem('地表放射 L_up','#f87171');var vRn=createItem('純放射 Net Rn','#38bdf8');var gTrack=d.createElement('div');gTrack.style.cssText='width:540px;height:18px;background:#1e293b;border-radius:9px;position:relative;margin:0 auto;overflow:hidden;';mon.appendChild(gTrack);var gZero=d.createElement('div');gZero.style.cssText='position:absolute;left:269px;top:0;width:2px;height:18px;background:#64748b;z-index:2;';gTrack.appendChild(gZero);var gBar=d.createElement('div');gBar.style.cssText='position:absolute;top:0;height:18px;z-index:1;';gTrack.appendChild(gBar);var gScale=d.createElement('div');gScale.style.cssText='display:flex;justify-content:space-between;font-size:9px;color:#64748b;margin-top:4px;padding:0 4px;';var s1=d.createElement('span');s1.textContent='冷却 -300 W/m2';var s2=d.createElement('span');s2.textContent='0';var s3=d.createElement('span');s3.textContent='加熱 +700 W/m2';gScale.appendChild(s1);gScale.appendChild(s2);gScale.appendChild(s3);mon.appendChild(gScale);var exp=d.createElement('div');exp.style.cssText='background:#0f172a;border-radius:8px;padding:10px;font-size:11px;color:#cbd5e1;line-height:1.6;min-height:48px;box-sizing:border-box;border:1px solid #1e293b;';c.appendChild(exp);function calc(){var tVal=parseFloat(slTime.value);var cVal=parseFloat(slCloud.value);valTime.textContent=tVal.toFixed(1)+' 時';valCloud.textContent=cVal.toFixed(0)+' / 10';var rsIn=0;if(tVal>=6&&tVal<=18){rsIn=850*Math.sin((tVal-6)/12*Math.PI);}var rsNet=rsIn*(1-currentAlb);var lDown=280+(cVal*11);var tempFac=(tVal>=6&&tVal<=18)?Math.sin((tVal-6)/12*Math.PI):0;var lUp=380+(40*tempFac*(1-currentAlb));var netRn=rsNet+lDown-lUp;vRs.textContent=rsNet.toFixed(1)+' W/m2';vLd.textContent=lDown.toFixed(1)+' W/m2';vLu.textContent=lUp.toFixed(1)+' W/m2';vRn.textContent=(netRn>=0?'+':'')+netRn.toFixed(1)+' W/m2';vRn.style.color=netRn>=0?'#fb923c':'#38bdf8';var centerPx=270;if(netRn>=0){var wPx=(netRn/700)*270;if(wPx>270){wPx=270;}gBar.style.left=centerPx+'px';gBar.style.width=wPx+'px';gBar.style.background='#fb923c';}else{var wPxN=(Math.abs(netRn)/300)*270;if(wPxN>270){wPxN=270;}var leftPos=centerPx-wPxN;gBar.style.left=leftPos+'px';gBar.style.width=wPxN+'px';gBar.style.background='#38bdf8';}if(netRn>0){exp.textContent='【加熱状態（Net Rn: +'+netRn.toFixed(1)+' W/m2）】太陽短波放射の吸収が地表からの長波放射損失を上回っています。地表面温度は上昇傾向にあります。';}else{var radRate=Math.abs(netRn).toFixed(1);var cloudText=(cVal<=2)?'快晴のため大気逆放射が小さく、急激な冷却が発生しています。':'雲が赤外線を再放射しているため、冷却は比較的穏やかです。';exp.textContent='【放射冷却状態（Net Rn: -'+radRate+' W/m2）】日射が途絶え、地表の長波射出が上回るため熱が宇宙空間へ逃げています。'+cloudText;}}slTime.oninput=calc;slCloud.oninput=calc;calc();})();
  </script>
</body>
</html>
