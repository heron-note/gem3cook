rd.appendChild(statusBox);var monitor=d.createElement('div');monitor.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;';var timerEl=d.createElement('div');timerEl.style.cssText='color:#38bdf8;font-size:24px;font-weight:bold;font-family:monospace;text-align:center;';monitor.appendChild(timerEl);var revEl=d.createElement('div');revEl.style.cssText='color:#facc15;font-size:12px;';monitor.appendChild(revEl);var rotEl=d.createElement('div');rotEl.style.cssText='color:#60a5fa;font-size:12px;';monitor.appendChild(rotEl);var lifeEl=d.createElement('div');lifeEl.style.cssText='color:#94a3b8;font-size:12px;';monitor.appendChild(lifeEl);var fidgetLabel=d.createElement('div');fidgetLabel.style.cssText='color:#f8fafc;font-size:12px;';monitor.appendChild(fidgetLabel);var rail=d.createElement('div');rail.style.cssText='background-color:#1e293b;border:1px solid #334155;height:10px;border-radius:5px;width:auto;overflow:hidden;box-sizing:border-box;';var bar=d.createElement('div');bar.style.cssText='background-color:#f59e0b;height:10px;width:0px;';rail.appendChild(bar);monitor.appendChild(rail);card.appendChild(monitor);var btnGroup=d.createElement('div');btnGroup.style.cssText='display:flex;flex-direction:column;gap:8px;';var scanBtn=d.createElement('button');scanBtn.style.cssText='background-color:#0284c7;border-radius:8px;font-size:12px;font-weight:bold;color:#ffffff;border:none;padding:10px;cursor:pointer;';scanBtn.textContent='🛰️ 配送状況をスキャン';btnGroup.appendChild(scanBtn);var predictBtn=d.createElement('button');predictBtn.style.cssText='background-color:#b45309;border-radius:8px;font-size:12px;font-weight:bold;color:#ffffff;border:none;padding:10px;cursor:pointer;';predictBtn.textContent='⏱️ 到着時刻を精密予測';btnGroup.appendChild(predictBtn);var arrivedBtn=d.createElement('button');arrivedBtn.style.cssText='background-color:#15803d;border-radius:8px;font-size:12px;font-weight
