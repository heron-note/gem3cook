</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🐢 月曜到達阻止カウンター - ゼノンの盾';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100%;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var title=d.createElement('div');title.style.cssText='color:#38bdf8;font-size:18px;font-weight:bold;text-align:center;letter-spacing:1px;';title.textContent='🐢 月曜到達阻止カウンター';card.appendChild(title);var subtitle=d.createElement('div');subtitle.style.cssText='color:#94a3b8;font-size:12px;text-align:center;margin-top:-6px;';subtitle.textContent='「ゼノンのパラドックスで月曜0時を無限遠へ追放する」';card.appendChild(subtitle);var statusBox=d.createElement('div');statusBox.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;color:#38bdf8;font-family:monospace;padding:12px;border-radius:8px;font-size:13px;line-height:1.6;';card.appendChild(statusBox);var now=new Date();var target=new Date(now.getTime());target.setHours(24,0,0,0);var T=(target.getTime()-now.getTime())/1000;if(T<=0)T=3600;var n=0;var S_n=0;var R_n=T;function playWarpSound(){try{var AudioContext=w.AudioContext||w.webkitAudioContext;if(!AudioContext)return;var ctx=new AudioContext();var osc=ctx.createOscillator();var gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(120,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.35);gain.gain.setValueAtTime(0.2,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.36);}catch(e){}}function renderStatus(){while(statusBox.firstChild){statusBox.removeChild(statusBox.firstChild);}var l1=d.createElement('div');l1.style.cssText='font-weight:bold;color:#34d399;';l1.textContent='🛡️ ゼノン防壁：完全展開中';statusBox.appendChild(l1);var l2=d.createElement('div');l2.textContent='月曜到達確率：0.000000... (到達不能)';statusBox.appendChild(l2);var l3=d.createElement('div');l3.textContent='未踏の残り距離(時間)：'+R_n.toExponential(4)+' 秒';statusBox.appendChild(l3);var l4=d.createElement('div');var ratioStr=(n===0)?'0':S_n.toFixed(3)+' / '+T.toFixed(3)+' 秒 ('+((1-Math.pow(0.5,n))*100).toFixed(4)+' 走破)';l4.textContent='累積走破級数：S_'+n+' = '+ratioStr;statusBox.appendChild(l4);}var listContainer=d.createElement('div');listContainer.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;max-height:160px;overflow-y:auto;font-size:12px;font-family:monospace;display:flex;flex-direction:column;gap:6px;';card.appendChild(listContainer);function addHistoryRow(step,delta,rem){var row=d.createElement('div');row.style.cssText='color:#94a3b8;border-bottom:1px solid #1e293b;padding-bottom:4px;';var pct=((1-Math.pow(0.5,step))*100).toFixed(4);row.textContent='Step '+step+': +'+delta.toFixed(3)+'秒 観測 (走破率:'+pct+' | 残り:'+rem.toExponential(3)+'秒)';listContainer.insertBefore(row,listContainer.firstChild);}var btnObserve=d.createElement('button');btnObserve.style.cssText='background-color:#0284c7;color:#ffffff;border:none;border-radius:8px;font-size:13px;font-weight:bold;padding:10px;cursor:pointer;transition:background 0.2s;';btnObserve.textContent='🛡️ 次の中間点を分割観測（無限後退）';btnObserve.onclick=function(){n=n+1;var delta=T/Math.pow(2,n);S_n=S_n+delta;R_n=T/Math.pow(2,n);playWarpSound();renderStatus();addHistoryRow(n,delta,R_n);};card.appendChild(btnObserve);var btnCopy=d.createElement('button');btnCopy.style.cssText='background-color:#334155;color:#ffffff;border:none;border-radius:8px;font-size:12px;padding:8px;cursor:pointer;';btnCopy.textContent='📋 「月曜到達不能証明」をコピー';btnCopy.onclick=function(){var proofText='【数学的証明】ゼノンのパラドックス（無限等比級数）により、今夜の月曜日は論理的に到達不可能であることが証明されました。現在の分割ステップ：第'+n+'中間点 #月曜到達阻止カウンター #ゼノンの盾';if(w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){w.navigator.clipboard.writeText(proofText).then(function(){btnCopy.textContent='✅ 証明をクリップボードにコピーしました！';setTimeout(function(){btnCopy.textContent='📋 「月曜到達不能証明」をコピー';},2000);});}else{var ta=d.createElement('textarea');ta.value=proofText;ta.style.cssText='position:fixed;top:-9999px;left:-9999px;';body.appendChild(ta);ta.focus();ta.select();d.execCommand('copy');body.removeChild(ta);btnCopy.textContent='✅ 証明をクリップボードにコピーしました！';setTimeout(function(){btnCopy.textContent='📋 「月曜到達不能証明」をコピー';},2000);}};card.appendChild(btnCopy);renderStatus();})();
  </script>
