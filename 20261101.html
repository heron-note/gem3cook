<!DOCTYPE html>
<html lang="ja">
<head>

  <title>☕ 紅茶タンニン暴走シミュレーター</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='☕ 紅茶タンニン暴走シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var tSteep=420;var pressLv=1;function beep(freq){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ctx=new AC();var osc=ctx.createOscillator();var g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq||520,ctx.currentTime);g.gain.setValueAtTime(0.04,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);}catch(e){}}var titleBox=d.createElement('div');titleBox.style.cssText='text-align:center;display:flex;flex-direction:column;gap:4px;';var titleEl=d.createElement('div');titleEl.textContent='☕ 紅茶抽出化学・タンニン激渋暴走シミュレーター';titleEl.style.cssText='font-size:20px;font-weight:bold;color:#f59e0b;';var subEl=d.createElement('div');subEl.textContent='紅茶の日に暴く貧乏性放置と口腔収斂作用の真実';subEl.style.cssText='font-size:12px;color:#94a3b8;';titleBox.appendChild(titleEl);titleBox.appendChild(subEl);card.appendChild(titleBox);var opBox=d.createElement('div');opBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(opBox);var timeRow=d.createElement('div');timeRow.style.cssText='display:flex;justify-content:space-between;align-items:center;font-size:13px;';var timeLbl=d.createElement('span');timeLbl.textContent='放置時間:';var timeVal=d.createElement('span');timeVal.style.cssText='font-weight:bold;color:#38bdf8;';timeRow.appendChild(timeLbl);timeRow.appendChild(timeVal);opBox.appendChild(timeRow);var slider=d.createElement('input');slider.type='range';slider.min='60';slider.max='900';slider.step='30';slider.value='420';slider.style.cssText='width:100%;cursor:pointer;accent-color:#f59e0b;margin:0;';opBox.appendChild(slider);var pressRow=d.createElement('div');pressRow.style.cssText='display:flex;flex-direction:column;gap:6px;';var pressTitle=d.createElement('span');pressTitle.textContent='スプーン絞り込み加圧:';pressTitle.style.cssText='font-size:13px;color:#cbd5e1;';pressRow.appendChild(pressTitle);var btnWrap=d.createElement('div');btnWrap.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;';var btn0=d.createElement('button');btn0.textContent='なし';var btn1=d.createElement('button');btn1.textContent='軽くギュー';var btn2=d.createElement('button');btn2.textContent='限界絞り';var btns=[btn0,btn1,btn2];for(var i=0;i<btns.length;i++){btns[i].style.cssText='padding:8px 0;background-color:#1e293b;border:1px solid #475569;border-radius:6px;color:#f8fafc;font-size:12px;font-weight:bold;cursor:pointer;';btnWrap.appendChild(btns[i]);}pressRow.appendChild(btnWrap);opBox.appendChild(pressRow);var mon=d.createElement('div');mon.style.cssText='background-color:#0f172a;border:1px solid #f59e0b;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(mon);var stLabel=d.createElement('div');stLabel.style.cssText='font-weight:bold;font-size:14px;';mon.appendChild(stLabel);var astVal=d.createElement('div');astVal.style.cssText='font-size:30px;font-weight:bold;color:#f8fafc;letter-spacing:0.5px;';mon.appendChild(astVal);var grid=d.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;';var gUmami=d.createElement('div');gUmami.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gDry=d.createElement('div');gDry.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gMilk=d.createElement('div');gMilk.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gPoverty=d.createElement('div');gPoverty.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';grid.appendChild(gUmami);grid.appendChild(gDry);grid.appendChild(gMilk);grid.appendChild(gPoverty);mon.appendChild(grid);var note=d.createElement('div');note.textContent='※本ツールの数値は成分溶出特性に基づく演出用仮定値であり、茶葉品種や湯温により実測値は異なります。';note.style.cssText='font-size:10px;color:#64748b;line-height:1.4;';mon.appendChild(note);var rep=d.createElement('div');rep.style.cssText='background-color:#1e293b;border-left:4px solid #f59e0b;border-radius:6px;padding:12px;font-size:11px;line-height:1.6;color:#cbd5e1;';rep.textContent='【抽出化学による現実宣告】せっかくのティーバッグだからと限界まで浸し続けた結果、うま味の溶出ピークを過ぎて高分子タンニンが飽和溶出。ひと口含んだ瞬間に唾液ムチンが凝固し、口腔内の滑らかさが失われて舌がキシキシに硬直します。スプーンで絞り潰してトドメを刺した液体は、砂糖もミルクも受け付けないただの苦渋の泥水です。元を取ろうとした浅ましさが、優雅なはずのティータイムを喉の拷問へと変滅させました。決められた時間で引き上げなさい。';card.appendChild(rep);function updatePressBtns(){for(var k=0;k<btns.length;k++){if(k===pressLv){btns[k].style.backgroundColor='#f59e0b';btns[k].style.color='#0f172a';btns[k].style.borderColor='#fbbf24';}else{btns[k].style.backgroundColor='#1e293b';btns[k].style.color='#f8fafc';btns[k].style.borderColor='#475569';}}}function render(){var mins=Math.floor(tSteep/60);var secs=tSteep-mins*60;var secStr=secs<10?('0'+secs):(''+secs);timeVal.textContent=mins+'分'+secStr+'秒（'+tSteep+'秒）';updatePressBtns();var umami=tSteep<=180?Math.round((tSteep/180)*100):Math.max(30,100-Math.round((tSteep-180)*0.15));var tanninBase=tSteep<=180?(tSteep/180)*40:40+Math.pow((tSteep-180)/40,1.4);var pressMult=pressLv==0?1.0:(pressLv==1?1.5:2.5);var astringency=Math.min(999,Math.round(tanninBase*pressMult));var dryPt=Math.min(100,Math.round(astringency*0.25));var statusText='';var stColor='#38bdf8';var milkText='';var povText='';if(astringency<60){statusText='⚠️ 状態: 黄金のバランス（高貴なティータイム）';stColor='#4ade80';milkText='ミルク防御力: 余裕で調和';povText='貧乏性レベル: 紳士的ジェントル';}else if(astringency<150){statusText='⚠️ 状態: やや過抽出（渋みが主張し始める）';stColor='#facc15';milkText='ミルク防御力: ギリギリ中和';povText='貧乏性レベル: もったいない精神';}else if(astringency<300){statusText='⚠️ 状態: 口腔砂漠化（唾液ムチン急速変性）';stColor='#fb923c';milkText='ミルク防御力: 貫通（分離寸前）';povText='貧乏性レベル: 元取れ執着症';}else{statusText='⚠️ 状態: 激渋の泥水（元取れ信仰の完全敗北）';stColor='#ef4444';milkText='ミルク防御力: 完全突破（無力化）';povText='貧乏性レベル: ドケチ自爆テロ';}stLabel.textContent=statusText;stLabel.style.color=stColor;astVal.textContent='渋味エグみ度: '+astringency+' pt';gUmami.textContent='うま味指数: '+umami+' pt';gDry.textContent='口腔キシキシ指数: '+dryPt+' pt';gMilk.textContent=milkText;gPoverty.textContent=povText;}slider.oninput=function(){tSteep=parseInt(slider.value,10);render();beep(440+tSteep*0.3);};btn0.onclick=function(){pressLv=0;render();beep(520);};btn1.onclick=function(){pressLv=1;render();beep(660);};btn2.onclick=function(){pressLv=2;render();beep(880);};render();})();
  </script>
