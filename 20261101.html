<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ 紅茶激渋キシキシ演出シミュレーター</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='☕ 紅茶激渋キシキシ演出シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var tSteep=420;var pressLv=1;function beep(freq){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ctx=new AC();var osc=ctx.createOscillator();var g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq||520,ctx.currentTime);g.gain.setValueAtTime(0.04,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);}catch(e){}}var titleBox=d.createElement('div');titleBox.style.cssText='text-align:center;display:flex;flex-direction:column;gap:4px;';var titleEl=d.createElement('div');titleEl.textContent='☕ 紅茶抽出・貧乏性放置と激渋キシキシ演出シミュレーター';titleEl.style.cssText='font-size:19px;font-weight:bold;color:#f59e0b;';var subEl=d.createElement('div');subEl.textContent='食品化学の収斂味コラムと元取れ信仰のジョークモデル';subEl.style.cssText='font-size:12px;color:#94a3b8;';titleBox.appendChild(titleEl);titleBox.appendChild(subEl);card.appendChild(titleBox);var opBox=d.createElement('div');opBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(opBox);var timeRow=d.createElement('div');timeRow.style.cssText='display:flex;justify-content:space-between;align-items:center;font-size:13px;';var timeLbl=d.createElement('span');timeLbl.textContent='放置時間:';var timeVal=d.createElement('span');timeVal.style.cssText='font-weight:bold;color:#38bdf8;';timeRow.appendChild(timeLbl);timeRow.appendChild(timeVal);opBox.appendChild(timeRow);var slider=d.createElement('input');slider.type='range';slider.min='60';slider.max='900';slider.step='30';slider.value='420';slider.style.cssText='width:100%;cursor:pointer;accent-color:#f59e0b;margin:0;';opBox.appendChild(slider);var pressRow=d.createElement('div');pressRow.style.cssText='display:flex;flex-direction:column;gap:6px;';var pressTitle=d.createElement('span');pressTitle.textContent='スプーン絞り加圧:';pressTitle.style.cssText='font-size:13px;color:#cbd5e1;';pressRow.appendChild(pressTitle);var btnWrap=d.createElement('div');btnWrap.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;';var btn0=d.createElement('button');btn0.textContent='なし';var btn1=d.createElement('button');btn1.textContent='軽く押す';var btn2=d.createElement('button');btn2.textContent='限界まで絞り潰す';var btns=[btn0,btn1,btn2];for(var i=0;i<btns.length;i++){btns[i].style.cssText='padding:8px 0;background-color:#1e293b;border:1px solid #475569;border-radius:6px;color:#f8fafc;font-size:12px;font-weight:bold;cursor:pointer;';btnWrap.appendChild(btns[i]);}pressRow.appendChild(btnWrap);opBox.appendChild(pressRow);var mon=d.createElement('div');mon.style.cssText='background-color:#0f172a;border:1px solid #f59e0b;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(mon);var stLabel=d.createElement('div');stLabel.style.cssText='font-weight:bold;font-size:14px;';mon.appendChild(stLabel);var astVal=d.createElement('div');astVal.style.cssText='font-size:30px;font-weight:bold;color:#f8fafc;letter-spacing:0.5px;';mon.appendChild(astVal);var grid=d.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;';var gKishi=d.createElement('div');gKishi.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gPoverty=d.createElement('div');gPoverty.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gMilk=d.createElement('div');gMilk.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';var gBag=d.createElement('div');gBag.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;';grid.appendChild(gKishi);grid.appendChild(gPoverty);grid.appendChild(gMilk);grid.appendChild(gBag);mon.appendChild(grid);var note=d.createElement('div');note.textContent='※本ツールの計算式・数値・判定はすべてジョーク用の仮想モデル（演出）であり、実際の成分濃度や物理量を測定・予測するものではありません。';note.style.cssText='font-size:10px;color:#64748b;line-height:1.4;';mon.appendChild(note);var rep=d.createElement('div');rep.style.cssText='background-color:#1e293b;border-left:4px solid #f59e0b;border-radius:6px;padding:12px;font-size:11px;line-height:1.6;color:#cbd5e1;';rep.textContent='【食品化学の仕組みと日常の皮肉】紅茶の渋味（収斂味）は、浸出したポリフェノール類（テアフラビンやテアルビジン等）が唾液中のタンパク質と結合し、口腔内の潤滑性を低下させることで生じる触覚的な感覚です。溶出速度は茶葉の細かさや湯温などの条件に依存しますが、長時間放置したりスプーンで強く絞ったりすれば、それだけ多くの苦渋味成分が液中に放出されます。『1パックの元を限界まで取ろう』と欲張って放置＆圧搾した結果、待っているのは舌がキシキシする激渋体験です。優雅な紅茶を楽しむなら、欲張らずに適度な時間で引き上げましょう。';card.appendChild(rep);function updatePressBtns(){for(var k=0;k<btns.length;k++){if(k===pressLv){btns[k].style.backgroundColor='#f59e0b';btns[k].style.color='#0f172a';btns[k].style.borderColor='#fbbf24';}else{btns[k].style.backgroundColor='#1e293b';btns[k].style.color='#f8fafc';btns[k].style.borderColor='#475569';}}}function render(){var mins=Math.floor(tSteep/60);var secs=tSteep-mins*60;var secStr=secs<10?('0'+secs):(''+secs);timeVal.textContent=mins+'分'+secStr+'秒（'+tSteep+'秒）';updatePressBtns();var baseVal=tSteep<=180?(tSteep/180)*40:40+Math.pow((tSteep-180)/35,1.5);var mult=pressLv==0?1.0:(pressLv==1?1.6:2.8);var shibumiScore=Math.min(999,Math.round(baseVal*mult));var kishikishiPt=Math.min(100,Math.round(shibumiScore*0.25));var statusText='';var stColor='#38bdf8';var povText='';var milkText='';var bagText='';if(pressLv==0){bagText='バッグ状態: ふんわり無傷';}else if(pressLv==1){bagText='バッグ状態: 軽く圧縮';}else{bagText='バッグ状態: 完全ぺちゃんこ';}if(shibumiScore<60){statusText='⚠️ 判定: 優雅なティータイム（適正引き上げ）';stColor='#4ade80';povText='貧乏性執念: 紳士的自制';milkText='ミルク投入: まろやかに調和';}else if(shibumiScore<160){statusText='⚠️ 判定: ちょい欲張り抽出（渋みの主張）';stColor='#facc15';povText='貧乏性執念: もったいない精神';milkText='ミルク投入: ギリギリ中和';}else if(shibumiScore<320){statusText='⚠️ 判定: 舌キシキシ警報（貧乏性の発動）';stColor='#fb923c';povText='貧乏性執念: 元取れ執着症';milkText='ミルク投入: 渋みが貫通';}else{statusText='⚠️ 判定: 激渋の泥水ランク（元取れ信仰の自爆）';stColor='#ef4444';povText='貧乏性執念: ドケチ大爆発';milkText='ミルク投入: 完全無力化';}stLabel.textContent=statusText;stLabel.style.color=stColor;astVal.textContent='激渋演出スコア: '+shibumiScore+' pt';gKishi.textContent='舌のキシキシ演出度: '+kishikishiPt+' pt';gPoverty.textContent=povText;gMilk.textContent='ミルク演出: '+milkText;gBag.textContent=bagText;}slider.oninput=function(){tSteep=parseInt(slider.value,10);render();beep(440+tSteep*0.3);};btn0.onclick=function(){pressLv=0;render();beep(520);};btn1.onclick=function(){pressLv=1;render();beep(660);};btn2.onclick=function(){pressLv=2;render();beep(880);};render();})();
  </script>
</body>
</html>
