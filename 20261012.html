  <title>🔥 自宅アスリート・熱力学第一法則シミュレーター</title>
</head>

  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🔥 自宅アスリート・熱力学第一法則シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var title=d.createElement('div');title.style.cssText='color:#38bdf8;font-size:20px;font-weight:bold;text-align:center;';title.textContent='🔥 自宅アスリート・熱力学第一法則シミュレーター';card.appendChild(title);var sub=d.createElement('div');sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;';sub.textContent='スポーツの日に解き明かす安静時消費vsポテチの熱量平衡';card.appendChild(sub);function beep(){try{var ctx=new (window.AudioContext||window.webkitAudioContext)();var osc=ctx.createOscillator();osc.frequency.value=880;osc.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.05);}catch(e){}}var state={kcal:336,weight:65,time:3.0};var snacks=[{n:'🥔 ポテチ 1袋',k:336},{n:'🍨 アイス 1個',k:280},{n:'🍫 チョコ 1枚',k:279},{n:'🥤 コーラ 500ml',k:225},{n:'🈳 なし',k:0}];var controls=d.createElement('div');controls.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;';card.appendChild(controls);var snackContainer=d.createElement('div');snackContainer.style.cssText='display:flex;flex-wrap:wrap;gap:8px;';controls.appendChild(snackContainer);var btns=[];for(var i=0;i<snacks.length;i++){(function(idx){var b=d.createElement('button');b.style.cssText='border:none;border-radius:4px;padding:8px 12px;color:#f8fafc;cursor:pointer;font-family:inherit;font-size:14px;';b.textContent=snacks[idx].n;b.onclick=function(){beep();state.kcal=snacks[idx].k;update();};btns.push(b);snackContainer.appendChild(b);})(i);}function createSlider(label,min,max,step,val){var w=d.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:4px;';var l=d.createElement('div');l.style.cssText='font-size:14px;color:#cbd5e1;';var r=d.createElement('div');r.style.cssText='display:flex;align-items:center;gap:12px;';var i=d.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.style.cssText='box-sizing:border-box;cursor:pointer;flex:1;';var v=d.createElement('div');v.style.cssText='width:50px;text-align:right;font-variant-numeric:tabular-nums;';r.appendChild(i);r.appendChild(v);w.appendChild(l);w.appendChild(r);return {w:w,l:l,i:i,v:v};}var wSlider=createSlider('体重',40,100,1,65);controls.appendChild(wSlider.w);wSlider.i.oninput=function(){state.weight=parseFloat(wSlider.i.value);update();};wSlider.i.onchange=beep;var tSlider=createSlider('横臥安静時間',0.5,12.0,0.5,3.0);controls.appendChild(tSlider.w);tSlider.i.oninput=function(){state.time=parseFloat(tSlider.i.value);update();};tSlider.i.onchange=beep;var monitor=d.createElement('div');monitor.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;';card.appendChild(monitor);var pLabel=d.createElement('div');pLabel.style.cssText='font-size:15px;font-weight:bold;color:#38bdf8;';monitor.appendChild(pLabel);var jumpLabel=d.createElement('div');jumpLabel.style.cssText='font-size:30px;font-weight:bold;color:#f8fafc;text-align:center;padding:10px 0;';monitor.appendChild(jumpLabel);var grid=d.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;';monitor.appendChild(grid);function gridItem(){var div=d.createElement('div');div.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;color:#cbd5e1;';return div;}var qOutLabel=gridItem();var eInLabel=gridItem();var dRunLabel=gridItem();var balanceLabel=gridItem();grid.appendChild(qOutLabel);grid.appendChild(eInLabel);grid.appendChild(dRunLabel);grid.appendChild(balanceLabel);var note=d.createElement('div');note.style.cssText='font-size:11px;color:#64748b;margin-top:4px;';note.textContent='※1 METsを用いた安静時消費量の簡易モデルです。体脂肪の増減や実際の運動能力を示すものではありません。';monitor.appendChild(note);var report=d.createElement('div');report.style.cssText='background-color:#1e293b;border-left:4px solid #38bdf8;border-radius:6px;padding:12px 11px;line-height:1.6;color:#cbd5e1;font-size:13px;';report.textContent='【熱力学的考察：自宅アスリートの敗北】寝転がっているだけでも、人体は白熱電球並みの平均出力でエネルギーを消費し、周囲へ熱を放散し続けています。力学的な仕事量に換算すれば、3時間で垂直跳び3,000回分以上に匹敵する熱量を代謝しており、理論上の自宅アスリートとしては立派な数字です。しかし、摂取したお菓子のカロリーをこの安静消費の差引きだけで相殺しようとすれば、さらに数時間横たわり続けねばならず、喉が渇いて炭酸飲料を追加すれば不可逆エントロピーが増大して完全に破滅します。動け。';card.appendChild(report);function update(){for(var i=0;i<btns.length;i++){btns[i].style.backgroundColor=(snacks[i].k===state.kcal)?'#0284c7':'#334155';}wSlider.v.textContent=state.weight+' kg';wSlider.l.textContent='体重: '+state.weight+' kg';tSlider.v.textContent=state.time.toFixed(1)+' hr';tSlider.l.textContent='横臥安静時間: '+state.time.toFixed(1)+' 時間';var P_watt=(state.weight*24*4184/86400);var E_out_kcal=state.weight*state.time;var Q_out_joule=E_out_kcal*4184;var N_jump=Math.round((state.time*4184)/(9.8*0.4));var D_run=state.time;var delta_U=state.kcal-E_out_kcal;pLabel.textContent='🔥 平均熱出力: '+P_watt.toFixed(1)+' W（白熱電球並み）';var jumpStr=String(N_jump).replace(/\B(?=(\d{3})+(?!\d))/g,',');jumpLabel.textContent='等価垂直跳び: '+jumpStr+' 回分';var kJ=(Q_out_joule/1000).toFixed(0);qOutLabel.textContent='累積熱放散量: '+E_out_kcal.toFixed(0)+' kcal / '+kJ+' kJ';eInLabel.textContent='摂取化学エネルギー: '+state.kcal+' kcal';dRunLabel.textContent='等価ランニング距離: '+D_run.toFixed(1)+' km相当';if(delta_U>0){balanceLabel.textContent='簡易エネルギー収支: 摂取超過 +'+delta_U.toFixed(0)+' kcal';balanceLabel.style.color='#ef4444';}else{balanceLabel.textContent='簡易エネルギー収支: 消費超過 '+delta_U.toFixed(0)+' kcal';balanceLabel.style.color='#10b981';}}update();})();
  </script>
