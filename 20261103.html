  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🎨 巨匠画風プロンプト診断';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var questions=[{q:'予定のない休日、どう過ごすことが多い？',a:['思いついたことを次々試す','景色や空気を楽しみながらのんびり','好きなことに没頭して時間を忘れる','自分の世界にこもって創作や妄想']},{q:'新しい作業や趣味を始めるときは？',a:['まず行動！やりながら考える','全体の雰囲気をつかんで進める','手順や仕組みを研究してから挑戦','自分なりの美学や完成形を考える']},{q:'自分の部屋やデスク周りの状態は？',a:['物もアイデアも勢いよく展開中','居心地重視。自然体で落ち着く空間','必要なものが整理された機能的空間','好きなものに囲まれた独自の世界']},{q:'周りからどんな性格だと言われる？',a:['情熱的でエネルギッシュ','穏やかで感受性が豊か','冷静で観察力がある','個性的で発想が独特']},{q:'見ていて一番テンションが上がる景色は？',a:['燃えるような夕焼けや荒々しい自然','朝霧や水面に映る柔らかな光','雄大な海や山、ダイナミックな波','花々や装飾に彩られた幻想的な風景']}];var artists=[{name:'フィンセント・ファン・ゴッホ',short:'ゴッホ',desc:'情熱と生命力の爆発。渦巻く筆致、鮮烈な色彩、厚塗りの絵具で感情を画面いっぱいに表現する。',style:'ゴッホを思わせるポスト印象派の表現。力強い渦巻く筆致、厚みのある絵具の質感、鮮烈な黄色や青、うねるような構図で情熱と内面のエネルギーを表現する。'},{name:'クロード・モネ',short:'モネ',desc:'光と空気の魔術師。輪郭よりも光の変化、色の重なり、その瞬間の空気感を大切にする。',style:'モネを思わせる印象派の表現。柔らかな筆触、淡く重なる色彩、自然光の反射、光と空気の揺らぎを大切にし、夢のような透明感を表現する。'},{name:'葛飾北斎',short:'北斎',desc:'大胆な構図と緻密な観察。波や雲、自然の力を躍動感あふれる線と構成で描き出す。',style:'葛飾北斎を思わせる浮世絵の表現。明快な輪郭線、大胆な遠近法、緻密な描写、藍色を中心とした色彩構成で、自然の迫力と造形美を表現する。'},{name:'アルフォンス・ミュシャ',short:'ミュシャ',desc:'優雅な曲線と装飾美。植物文様、流麗な髪、繊細な縁取りで幻想的な世界を作り上げる。',style:'ミュシャを思わせるアール・ヌーヴォーの表現。優雅な曲線、植物の装飾模様、繊細な輪郭、調和した色彩、華麗な背景装飾で幻想的な美しさを表現する。'}];var answers=[-1,-1,-1,-1,-1];var cards=[];var buttonSets=[];var title=d.createElement('div');title.textContent='🎨 文化の日・魂の巨匠画風ジェネレーター';title.style.cssText='font-size:23px;font-weight:800;line-height:1.4;color:#f8fafc;';card.appendChild(title);var subtitle=d.createElement('div');subtitle.textContent='あなたの日常から、芸術家としての魂を発掘する。5つの質問で、あなた専用のAI画像生成プロンプトを作ります。';subtitle.style.cssText='font-size:13px;color:#cbd5e1;line-height:1.8;';card.appendChild(subtitle);var progressBox=d.createElement('div');progressBox.style.cssText='background:#0f172a;border-radius:12px;padding:13px;';var progressText=d.createElement('div');progressText.style.cssText='font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:9px;';progressBox.appendChild(progressText);var progressTrack=d.createElement('div');progressTrack.style.cssText='height:7px;background:#334155;border-radius:8px;overflow:hidden;';var progressBar=d.createElement('div');progressBar.style.cssText='height:7px;width:0px;background:linear-gradient(90deg,#f59e0b,#ec4899,#8b5cf6);border-radius:8px;transition:width.35s;';progressTrack.appendChild(progressBar);progressBox.appendChild(progressTrack);card.appendChild(progressBox);var questionTitle=d.createElement('div');questionTitle.textContent='YOUR DAILY LIFE';questionTitle.style.cssText='font-size:11px;letter-spacing:3px;font-weight:800;color:#fbbf24;margin-top:5px;';card.appendChild(questionTitle);var questionArea=d.createElement('div');questionArea.style.cssText='display:flex;flex-direction:column;gap:12px;';card.appendChild(questionArea);for(var i=0;i<questions.length;i++){var qc=d.createElement('div');qc.style.cssText='background:#263449;border:1px solid #475569;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;';var qhead=d.createElement('div');qhead.style.cssText='display:flex;align-items:center;gap:9px;';var qnum=d.createElement('div');qnum.textContent='0'+(i+1);qnum.style.cssText='font-size:12px;font-weight:900;color:#fbbf24;';qhead.appendChild(qnum);var qtext=d.createElement('div');qtext.textContent=questions[i].q;qtext.style.cssText='font-size:14px;font-weight:700;line-height:1.5;';qhead.appendChild(qtext);qc.appendChild(qhead);var opts=d.createElement('div');opts.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';var localButtons=[];for(var j=0;j<4;j++){var btn=d.createElement('button');btn.textContent=questions[i].a[j];btn.style.cssText='border:1px solid #64748b;border-radius:9px;padding:11px 9px;background:#334155;color:#e2e8f0;font-size:12px;line-height:1.6;text-align:left;cursor:pointer;min-height:55px;transition:all.2s;';btn.setAttribute('type','button');opts.appendChild(btn);localButtons.push(btn);}qc.appendChild(opts);var status=d.createElement('div');status.textContent='未回答';status.style.cssText='font-size:10px;color:#94a3b8;text-align:right;';qc.appendChild(status);questionArea.appendChild(qc);cards.push({card:qc,status:status});buttonSets.push(localButtons);}var resultTitle=d.createElement('div');resultTitle.textContent='YOUR MASTERPIECE';resultTitle.style.cssText='font-size:11px;letter-spacing:3px;font-weight:800;color:#fbbf24;margin-top:8px;';card.appendChild(resultTitle);var resultBox=d.createElement('div');resultBox.style.cssText='background:#0f172a;border:1px dashed #64748b;border-radius:13px;padding:17px;display:flex;flex-direction:column;gap:12px;transition:all.3s;';card.appendChild(resultBox);var resultMessage=d.createElement('div');resultMessage.textContent='🎨 すべての質問に答えると、あなた専用の画風プロンプトがここに生成されます。';resultMessage.style.cssText='font-size:13px;color:#94a3b8;line-height:1.8;text-align:center;padding:12px 4px;';resultBox.appendChild(resultMessage);var resultArtist=d.createElement('div');resultArtist.style.cssText='font-size:19px;font-weight:900;color:#fbbf24;display:none;';resultBox.appendChild(resultArtist);var resultDesc=d.createElement('div');resultDesc.style.cssText='font-size:12px;color:#cbd5e1;line-height:1.8;display:none;';resultBox.appendChild(resultDesc);var promptLabel=d.createElement('div');promptLabel.textContent='✨ AI IMAGE GENERATION PROMPT';promptLabel.style.cssText='font-size:10px;letter-spacing:2px;font-weight:800;color:#a78bfa;display:none;';resultBox.appendChild(promptLabel);var promptPreview=d.createElement('div');promptPreview.style.cssText='font-size:12px;line-height:1.9;color:#e2e8f0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow-y:auto;background:#1e293b;padding:13px;border-radius:9px;display:none;user-select:text;-webkit-user-select:text;';resultBox.appendChild(promptPreview);var copyBtn=d.createElement('button');copyBtn.textContent='📋 プロンプトをコピーする';copyBtn.style.cssText='display:none;width:100%;padding:15px;border:0;border-radius:10px;background:linear-gradient(110deg,#d97706,#db2777,#7c3aed);color:white;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 5px 15px rgba(124,58,237,.25);';copyBtn.setAttribute('type','button');resultBox.appendChild(copyBtn);var promptStr='';var columnTitle=d.createElement('div');columnTitle.textContent='🖼️ 美術史の小さな寄り道';columnTitle.style.cssText='font-size:14px;font-weight:800;color:#fbbf24;margin-top:7px;';card.appendChild(columnTitle);var column=d.createElement('div');column.style.cssText='background:#263449;border-radius:12px;padding:15px;font-size:12px;line-height:1.9;color:#cbd5e1;';column.textContent='ゴッホの絵には情熱が、モネの絵には光が、北斎の絵には自然への観察眼が、ミュシャの絵には装飾への美意識が宿っています。芸術家たちは、それぞれ違う目で世界を見ていました。';card.appendChild(column);var joke=d.createElement('div');joke.textContent='ちなみに、この診断に科学的根拠はありません。休日の過ごし方から芸術的才能が判明するなら、美術大学の入試はずいぶん楽になるはずです。';joke.style.cssText='font-size:11px;color:#94a3b8;line-height:1.8;border-top:1px solid #334155;padding-top:12px;';card.appendChild(joke);function makePrompt(artist){var lines=[];lines.push('あなたは優れた芸術家であり、画像生成の専門家です。以下の人物像を読み取り、その人の個性を反映した芸術作品を制作してください。');lines.push('');lines.push('');lines.push('あなたの魂の巨匠タイプ：'+artist.name);lines.push('');lines.push('');for(var k=0;k<5;k++){lines.push(questions[k].q+' '+questions[k].a[answers[k]]);}lines.push('');lines.push('');lines.push('回答の傾向を総合すると、この人物は'+artist.short+'タイプの芸術的感性を持っています。単純に回答を並べるだけではなく、5つの回答から感じられる性格、行動傾向、好み、世界の見方を総合的に解釈してください。');lines.push('');lines.push('');lines.push(artist.style);lines.push('');lines.push('');lines.push('手順1：この会話にユーザーが画像を添付している場合');lines.push('添付画像を主たるモチーフとして使用してください。元画像の人物、キャラクター、物体、構図などの重要な特徴や個性をできるだけ維持しながら、上記の診断結果と巨匠の画風を融合させた芸術作品に変換してください。単なるフィルター処理ではなく、画家が描き直したような完成度を目指してください。');lines.push('');lines.push('手順2：添付画像がない場合');lines.push('画像をいきなり生成せず、まずユーザーに何を描きたいか質問してください。人物、動物、キャラクター、風景、架空の存在など、自由に選べるようにしてください。必要なら外見、服装、背景、雰囲気なども追加で質問し、回答を受け取ってから画像を生成してください。');lines.push('');lines.push('');lines.push('診断された人物像を作品の色彩、構図、表情、背景、雰囲気に反映してください。画風の特徴を明確に表現し、安易なテンプレート画像にしないでください。美術作品としての完成度を重視し、文字や署名、透かしは原則として描かないでください。');lines.push('');lines.push('それでは、診断された人物の魂を映し出す一枚を制作してください。');return lines.join(' ');}function updateUI(){var count=0;for(var i=0;i<5;i++){if(answers[i]!==-1)count++;for(var j=0;j<4;j++){var b=buttonSets[i][j];if(answers[i]===j){b.style.background='#7c3aed';b.style.border='1px solid #c4b5fd';b.style.color='#ffffff';b.style.fontWeight='800';}else{b.style.background='#334155';b.style.border='1px solid #64748b';b.style.color='#e2e8f0';b.style.fontWeight='400';}}cards[i].status.textContent=answers[i]===-1?'未回答':'✓ 回答済み';cards[i].status.style.color=answers[i]===-1?'#94a3b8':'#86efac';cards[i].card.style.borderColor=answers[i]===-1?'#475569':'#8b5cf6';}progressText.textContent='診断の進行状況 '+count+' / 5 問';progressBar.style.width=(count*100/5*5)+'px';progressBar.style.width=count===5?'100%':(count*20)+'%';if(count<5){resultMessage.style.display='block';resultArtist.style.display='none';resultDesc.style.display='none';promptLabel.style.display='none';promptPreview.style.display='none';copyBtn.style.display='none';resultBox.style.border='1px dashed #64748b';resultMessage.textContent='🎨 あと '+(5-count)+' 問！すべての質問に答えると、あなた専用の画風プロンプトがここに生成されます。';return;}var scores=[0,0,0,0];var sum=0;for(var k=0;k<5;k++){scores[answers[k]]++;sum+=answers[k];}var max=0;for(var m=0;m<4;m++){if(scores[m]>max)max=scores[m];}var tied=[];for(var n=0;n<4;n++){if(scores[n]===max)tied.push(n);}var winner=-1;for(var p=4;p>=0;p--){if(tied.indexOf(answers[p])!==-1){winner=answers[p];break;}}if(winner===-1)winner=sum%4;var artist=artists[winner];promptStr=makePrompt(artist);resultMessage.style.display='none';resultArtist.style.display='block';resultDesc.style.display='block';promptLabel.style.display='block';promptPreview.style.display='block';copyBtn.style.display='block';resultBox.style.border='1px solid #a78bfa';resultBox.style.background='linear-gradient(145deg,#172554,#0f172a)';resultArtist.textContent='🏆 あなたの魂の巨匠は '+artist.short+'！';resultDesc.textContent=artist.desc+' 5つの回答を分析して、あなただけの画像生成プロンプトを完成させました。';promptPreview.textContent=promptStr;copyBtn.textContent='📋 プロンプトをコピーする';column.textContent=artist.desc+' この画家の技法を、あなたの日常の回答と組み合わせました。芸術とは世界の見方。つまり、あなたの部屋が散らかっていても、それはまだ誰も発見していない新しい美術運動なのかもしれません。';}function fallbackCopy(){var ta=d.createElement('textarea');ta.value=promptStr;ta.setAttribute('readonly','readonly');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=d.execCommand('copy');}catch(e){ok=false;}body.removeChild(ta);return ok;}function copyPrompt(){if(!promptStr)return;copyBtn.disabled=true;copyBtn.textContent='📋 コピーしています...';if(w.navigator.clipboard&&w.navigator.clipboard.writeText){w.navigator.clipboard.writeText(promptStr).then(function(){copySuccess();},function(){if(fallbackCopy())copySuccess();else copyFailure();});}else{if(fallbackCopy())copySuccess();else copyFailure();}}function copySuccess(){copyBtn.disabled=false;copyBtn.textContent='✅ コピー完了！AIに貼り付けてね';copyBtn.style.background='linear-gradient(110deg,#059669,#0d9488)';w.setTimeout(function(){copyBtn.textContent='📋 プロンプトをコピーする';copyBtn.style.background='linear-gradient(110deg,#d97706,#db2777,#7c3aed)';},3000);}function copyFailure(){copyBtn.disabled=false;copyBtn.textContent='⚠️ コピーできませんでした。もう一度お試しください';copyBtn.style.background='#b45309';}for(var x=0;x<5;x++){for(var y=0;y<4;y++){(function(q,v){buttonSets[q][v].onclick=function(){answers[q]=v;updateUI();};})(x,y);}}copyBtn.onclick=copyPrompt;updateUI();})();
