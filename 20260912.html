  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='⏳ ウラシマ効果・休日時間膨張シミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var C=299792.458;var audioCtx=null;function playSound(){try{if(!audioCtx){var AudioCtx=w.AudioContext||w.webkitAudioContext;if(AudioCtx)audioCtx=new AudioCtx();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(!audioCtx)return;var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);var now=audioCtx.currentTime;osc.frequency.setValueAtTime(180,now);osc.frequency.exponentialRampToValueAtTime(720,now+0.12);gain.setValueAtTime(0.15,now);gain.linearRampToValueAtTime(0,now+0.12);osc.start(now);osc.stop(now+0.12);}catch(e){}}var title=d.createElement('div');title.style.cssText='color:#38bdf8;font-size:18px;font-weight:bold;text-align:center;';title.textContent='⏳ ウラシマ効果・休日時間膨張シミュレーター';card.appendChild(title);var sub=d.createElement('div');sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;';sub.textContent='特殊相対性理論で休日の超高速消滅を阻止しようとした試み';card.appendChild(sub);var ctrlBox=d.createElement('div');ctrlBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;';card.appendChild(ctrlBox);var presetRow=d.createElement('div');presetRow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;';ctrlBox.appendChild(presetRow);function makeBtn(txt,bg){var b=d.createElement('button');b.textContent=txt;b.style.cssText='flex:1;min-width:90px;background-color:'+bg+';color:#ffffff;border:none;border-radius:6px;padding:8px 6px;font-size:11px;font-weight:bold;cursor:pointer;';return b;}var b0=makeBtn('🚶 自宅静止 (0c)','#334155');var b1=makeBtn('🚀 シャトル (0.00003c)','#334155');var b2=makeBtn('⚡ 準光速休眠 (0.990c)','#334155');presetRow.appendChild(b0);presetRow.appendChild(b1);presetRow.appendChild(b2);var boostBtn=d.createElement('button');boostBtn.textContent='😴 二度寝ブースト（仮定：β + 0.001）';boostBtn.style.cssText='background-color:#8b5cf6;color:#ffffff;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:bold;cursor:pointer;';ctrlBox.appendChild(boostBtn);var boostNote=d.createElement('div');boostNote.style.cssText='font-size:11px;color:#a78bfa;min-height:16px;text-align:center;';ctrlBox.appendChild(boostNote);var sliderLabel=d.createElement('div');sliderLabel.style.cssText='font-size:12px;color:#cbd5e1;display:flex;justify-content:space-between;';var sLeft=d.createElement('span');sLeft.textContent='巡航速度比 (β = v/c):';var sRight=d.createElement('span');sRight.textContent='0.800';sliderLabel.appendChild(sLeft);sliderLabel.appendChild(sRight);ctrlBox.appendChild(sliderLabel);var slider=d.createElement('input');slider.type='range';slider.min='0';slider.max='0.999';slider.step='0.001';slider.value='0.800';slider.style.cssText='width:100%;cursor:pointer;accent-color:#38bdf8;';ctrlBox.appendChild(slider);var monitor=d.createElement('div');monitor.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;';card.appendChild(monitor);var statusLabel=d.createElement('div');statusLabel.style.cssText='font-size:15px;font-weight:bold;text-align:center;';monitor.appendChild(statusLabel);var gaugeBg=d.createElement('div');gaugeBg.style.cssText='width:100%;height:10px;background-color:#1e293b;border-radius:5px;overflow:hidden;border:1px solid #334155;';monitor.appendChild(gaugeBg);var gaugeBar=d.createElement('div');gaugeBar.style.cssText='height:100%;background-color:#38bdf8;width:0px;border-radius:5px;';gaugeBg.appendChild(gaugeBar);var numRow=d.createElement('div');numRow.style.cssText='font-size:12px;color:#cbd5e1;display:flex;justify-content:space-between;';var numBeta=d.createElement('span');var numGamma=d.createElement('span');numRow.appendChild(numBeta);numRow.appendChild(numGamma);monitor.appendChild(numRow);var grid=d.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;background-color:#1e293b;padding:10px;border-radius:6px;';monitor.appendChild(grid);function makeCell(label,val){var box=d.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:2px;';var l=d.createElement('span');l.textContent=label;l.style.cssText='color:#94a3b8;font-size:11px;';var v=d.createElement('span');v.textContent=val;v.style.cssText='color:#f8fafc;font-weight:bold;font-size:13px;';box.appendChild(l);box.appendChild(v);return {box:box,valEl:v};}var cV=makeCell('巡航速度 v','0 km/s');var cG=makeCell('ローレンツ因子 γ','1.0000');var cT0=makeCell('あなたの固有時間','1.0 時間');var cT=makeCell('自宅基準系の座標時間','1時間 0分');grid.appendChild(cV.box);grid.appendChild(cG.box);grid.appendChild(cT0.box);grid.appendChild(cT.box);var frameNote=d.createElement('div');frameNote.style.cssText='color:#64748b;font-size:10px;text-align:center;';frameNote.textContent='※固有時間は移動する時計が刻む物理時間であり、心理的体感時間ではありません。';monitor.appendChild(frameNote);var report=d.createElement('div');report.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;color:#cbd5e1;font-size:11px;line-height:1.6;';report.textContent='【物理学的考察：休日延命計画の破綻】あなたが自宅基準系に対して亜光速で移動するという仮想条件を設定した場合、自宅基準系の座標時間は移動者の固有時間より多く経過します（ウラシマ効果）。つまり、あなたが固有時間1時間を過ごす間に、自宅基準系の時間はγ倍に拡大し、β=0.999では約22時間22分に達します。休日の延命どころか基準系側の休日を高速消費してしまうことが判明しました（なお、だらだらするだけではβは上がりません）。結論：相対論による休日延命計画は失敗しました。しかも、この実験を成立させるには自宅を出て高速移動する必要があり、『自宅から一歩も出ない休日』を守るという前提条件も同時に破壊されます。家にいればよかった。';card.appendChild(report);var copyBtn=d.createElement('button');copyBtn.textContent='📋 休日逃走証明をコピー';copyBtn.style.cssText='background-color:#0284c7;color:#ffffff;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:bold;cursor:pointer;';card.appendChild(copyBtn);var curBeta=0.8;var curGamma=1.6667;function update(bVal){curBeta=bVal;if(curBeta<0)curBeta=0;if(curBeta>0.999)curBeta=0.999;slider.value=curBeta;sRight.textContent=curBeta.toFixed(3);var gamma=1/Math.sqrt(1-curBeta*curBeta);curGamma=gamma;var vKm=curBeta*C;var coordH=gamma;var totalMin=Math.round(coordH*60);var h=Math.floor(totalMin/60);var m=totalMin-h*60;if(curBeta<0.5){statusLabel.textContent='日常ニュートン力学域（通常速度で休日消費中）';statusLabel.style.color='#38bdf8';}else if(curBeta<0.9){statusLabel.textContent='相対論的時空歪曲域（自宅基準系の経過時間が拡大）';statusLabel.style.color='#facc15';}else if(curBeta<0.99){statusLabel.textContent='準光速ウラシマ域（自宅基準系の休日が高速蒸発）';statusLabel.style.color='#fb923c';}else{statusLabel.textContent='休日延命計画・重大な計算ミス域（休日高速消費域）';statusLabel.style.color='#f87171';}var totalPx=gaugeBg.clientWidth||560;if(totalPx<=0)totalPx=560;var fillPx=Math.round(curBeta*totalPx);gaugeBar.style.width=fillPx+'px';numBeta.textContent='β = '+curBeta.toFixed(3);numGamma.textContent='γ ≒ '+gamma.toFixed(4);cV.valEl.textContent=vKm.toFixed(1)+' km/s';cG.valEl.textContent=gamma.toFixed(4);cT0.valEl.textContent='1.0 時間';cT.valEl.textContent=h+'時間 '+m+'分';}b0.onclick=function(){playSound();boostNote.textContent='';update(0);};b1.onclick=function(){playSound();boostNote.textContent='γ=1.00000000045：自宅基準系の1時間に対応する移動者の固有時間は約1.6マイクロ秒短縮';update(0.00003);};b2.onclick=function(){playSound();boostNote.textContent='';update(0.990);};boostBtn.onclick=function(){playSound();var nxt=parseFloat(slider.value)+0.001;nxt=Math.round(nxt*1000)/1000;if(nxt>0.999){nxt=0.999;boostNote.textContent='これ以上の二度寝は相対論では説明できません（延命失敗）';}else{boostNote.textContent='二度寝による休日延命措置を仮定しました。計算結果を再評価します。';}update(nxt);};slider.oninput=function(){playSound();boostNote.textContent='';update(parseFloat(slider.value));};function copyText(str){var done=false;if(w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){try{w.navigator.clipboard.writeText(str);done=true;}catch(e){}}if(!done){var ta=d.createElement('textarea');ta.value=str;ta.readOnly=true;ta.style.cssText='position:fixed;top:0;left:0;width:2em;height:2em;padding:0;border:none;outline:none;boxShadow:none;background:transparent;fontSize:16px;zIndex:-1;';body.appendChild(ta);ta.focus();ta.setSelectionRange(0,ta.value.length);try{done=d.execCommand('copy');}catch(e){}body.removeChild(ta);}return done;}copyBtn.onclick=function(){playSound();var text='【物理学的証明】特殊相対性理論（ローレンツ因子 γ='+curGamma.toFixed(4)+'）に基づく観測の結果、本日の休日は光速の'+curBeta.toFixed(3)+'倍で逃走中であることが確認されました。（※なお、本証明は休日そのものが物理的に運動していることを示すものではありません） #宇宙の日 #ウラシマ効果 #休日時間膨張シミュレーター';var ok=copyText(text);if(ok){copyBtn.textContent='✔ 証明書をコピー完了！';setTimeout(function(){copyBtn.textContent='📋 休日逃走証明をコピー';},1500);}};update(0.800);})();
