<!DOCTYPE html>

<body>
<script>
// 単体HTML実行用に変換されたコード
(function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🍚 白身先行TKGお遊びシミュレーター';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var tit=d.createElement('div');tit.textContent='🍚 白身先行TKGお遊びシミュレーター';tit.style.cssText='color:#38bdf8;font-size:20px;font-weight:bold;text-align:center;';card.appendChild(tit);var sub=d.createElement('div');sub.textContent='たまごかけごはんの日に考える泡立ての情熱と現実';sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;';card.appendChild(sub);var actx=null;function beep(){try{if(!actx){var AC=w.AudioContext||w.webkitAudioContext;if(AC)actx=new AC();}if(actx){var osc=actx.createOscillator();var g=actx.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,actx.currentTime);g.gain.setValueAtTime(0.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.08);osc.connect(g);g.connect(actx.destination);osc.start();osc.stop(actx.currentTime+0.08);}}catch(e){}}var ctrlBox=d.createElement('div');ctrlBox.style.cssText='display:flex;flex-direction:column;gap:8px;background-color:#0f172a;padding:12px;border-radius:10px;border:1px solid #334155;';card.appendChild(ctrlBox);var btnRow=d.createElement('div');btnRow.style.cssText='display:flex;gap:8px;';ctrlBox.appendChild(btnRow);var curSpd=1.0;var bNorm=d.createElement('button');bNorm.textContent='通常シャカシャカ (x1.0)';bNorm.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #38bdf8;background-color:#0284c7;color:#ffffff;font-size:12px;cursor:pointer;font-weight:bold;';btnRow.appendChild(bNorm);var bWild=d.createElement('button');bWild.textContent='猛烈ホイップ (x1.8)';bWild.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #475569;background-color:#1e293b;color:#94a3b8;font-size:12px;cursor:pointer;';btnRow.appendChild(bWild);var sRow=d.createElement('div');sRow.style.cssText='display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cbd5e1;';ctrlBox.appendChild(sRow);var sLabel=d.createElement('span');sLabel.textContent='撹拌回数: ';sRow.appendChild(sLabel);var sVal=d.createElement('span');sVal.textContent='20 回';sVal.style.cssText='font-weight:bold;color:#38bdf8;';sRow.appendChild(sVal);var slider=d.createElement('input');slider.type='range';slider.min='0';slider.max='300';slider.value='20';slider.style.cssText='width:100;box-sizing:border-box;cursor:pointer;';ctrlBox.appendChild(slider);var mon=d.createElement('div');mon.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center;';card.appendChild(mon);var jgLbl=d.createElement('div');jgLbl.style.cssText='font-size:15px;font-weight:bold;color:#f59e0b;';mon.appendChild(jgLbl);var volTxt=d.createElement('div');volTxt.style.cssText='font-size:30px;font-weight:bold;color:#38bdf8;';mon.appendChild(volTxt);var gBox=d.createElement('div');gBox.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;text-align:left;';mon.appendChild(gBox);function makeCell(t,c){var box=d.createElement('div');box.style.cssText='background-color:#1e293b;padding:8px;border-radius:6px;border:1px solid #334155;';var l=d.createElement('div');l.textContent=t;l.style.cssText='color:#94a3b8;font-size:11px;';box.appendChild(l);var v=d.createElement('div');v.style.cssText='font-weight:bold;margin-top:2px;color:'+c+';';box.appendChild(v);gBox.appendChild(box);return v;}var vMask=makeCell('味のボヤけ指数','#f87171');var vRisk=makeCell('ぬるシャバ危険度','#fbbf24');var vFoam=makeCell('泡の状態','#38bdf8');var vTire=makeCell('腕の疲労感','#a78bfa');var note=d.createElement('div');note.textContent='※本ツールの数値は調理科学の定性現象を元にした演出用パラメーターであり、実測予測値ではありません。';note.style.cssText='color:#64748b;font-size:11px;line-height:1.4;text-align:center;';card.appendChild(note);var rep=d.createElement('div');rep.style.cssText='background-color:#0b1329;border:1px solid #1e3a8a;border-radius:10px;padding:12px;font-size:12px;color:#cbd5e1;line-height:1.6;';rep.textContent='【調理科学の現象とお断り】白身を泡立てると見た目のボリュームは増しますが、気泡の層が舌への接触を阻害して味がボヤけやすくなります。また温かいご飯の上では時間とともに気泡が不安定化し、水分が分離してへたりやすくなります（※実際の崩壊速度は環境で変化します）。腕を筋肉痛にしてまで空気の山を作るより、適度に混ぜて温かいうちにさっさと食べなさい。';card.appendChild(rep);function update(){var N=parseInt(slider.value,10);sVal.textContent=N+' 回';var W=N*curSpd;var volVal=(1.0+2.0*(1.0-Math.exp(-0.01*W))).toFixed(2);var vFloat=parseFloat(volVal);var maskVal=Math.min(80,Math.round(25*(vFloat-1.0)*1.6));var riskVal=Math.min(100,Math.round(40*(vFloat-1.0)*1.3));volTxt.textContent='白身体積: 約 '+volVal+' 倍';vMask.textContent=maskVal+' pt';vRisk.textContent=riskVal+' pt';if(N<=10){jgLbl.textContent='未撹拌（白身のつるり感）';jgLbl.style.color='#94a3b8';}else if(N<=40){jgLbl.textContent='適度なほぐれ（黄金バランス）';jgLbl.style.color='#34d399';}else if(N<=120){jgLbl.textContent='気泡膨張（やや味がボヤけ気味）';jgLbl.style.color='#f59e0b';}else{jgLbl.textContent='過剰メレンゲ（空気の山・早食い推奨）';jgLbl.style.color='#ef4444';}if(vFloat<1.2){vFoam.textContent='液相主体';}else if(vFloat<1.8){vFoam.textContent='微細気泡混入';}else{vFoam.textContent='高密度フォーム';}if(W<30){vTire.textContent='余裕';}else if(W<100){vTire.textContent='心地よい疲労';}else if(W<200){vTire.textContent='そろそろ限界';}else{vTire.textContent='前腕崩壊寸前';}}bNorm.onclick=function(){curSpd=1.0;bNorm.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #38bdf8;background-color:#0284c7;color:#ffffff;font-size:12px;cursor:pointer;font-weight:bold;';bWild.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #475569;background-color:#1e293b;color:#94a3b8;font-size:12px;cursor:pointer;';beep();update();};bWild.onclick=function(){curSpd=1.8;bWild.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #e11d48;background-color:#be123c;color:#ffffff;font-size:12px;cursor:pointer;font-weight:bold;';bNorm.style.cssText='flex:1;padding:8px;border-radius:8px;border:1px solid #475569;background-color:#1e293b;color:#94a3b8;font-size:12px;cursor:pointer;';beep();update();};slider.oninput=function(){beep();update();};update();})();
</script>
