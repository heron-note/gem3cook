<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗💨 渋滞タイムロス＆時間損失ナビ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 700px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 6px 0;
    }
    .header p {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
    }
    .section {
      margin-bottom: 18px;
    }
    .section label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #38bdf8;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .speed-btn {
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #334155;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .speed-btn.active {
      background-color: #0284c7;
      border-color: #38bdf8;
    }
    .result-box {
      background-color: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }
    .res-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background-color: #1e293b;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-title {
      font-size: 12px;
      color: #94a3b8;
    }
    .loss-val {
      color: #ef4444;
      font-size: 28px;
      font-weight: bold;
      margin-top: 4px;
    }
    .rate-val {
      color: #f59e0b;
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }
    .conv-sec {
      background-color: #1e293b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .conv-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .conv-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: 13px;
      text-align: center;
    }
    .conv-item {
      background-color: #0f172a;
      padding: 8px 4px;
      border-radius: 6px;
    }
    .comment-box {
      padding: 12px 14px;
      border-radius: 8px;
      background-color: #1e293b;
      border-left: 4px solid #38bdf8;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
      transition: border-color 0.2s;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>🚗💨 渋滞タイムロス＆時間損失ナビ</h1>
      <p>お盆のUターンラッシュで失われる可処分時間を大真面目に可視化</p>
    </div>

    <!-- 距離 -->
    <div class="section">
      <label id="distLabel">渋滞の長さ: 15 km</label>
      <input type="range" id="distRange" min="1" max="100" value="15">
    </div>

    <!-- 速度 -->
    <div class="section">
      <label>通過速度</label>
      <div class="btn-group">
        <button type="button" class="speed-btn active" data-speed="10">🐢 10km/h</button>
        <button type="button" class="speed-btn" data-speed="5">🚶 5km/h</button>
        <button type="button" class="speed-btn" data-speed="1">🛑 1km/h</button>
      </div>
    </div>

    <!-- 年齢 -->
    <div class="section">
      <label id="ageLabel">あなたの年齢: 35 歳（80歳までの残り時間基準）</label>
      <input type="range" id="ageRange" min="10" max="79" value="35">
    </div>

    <!-- 結果 -->
    <div class="result-box">
      <div class="res-grid">
        <div class="stat-card">
          <div class="stat-title">純粋なタイムロス</div>
          <div class="loss-val" id="lossValue">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">余命可処分時間 損失率</div>
          <div class="rate-val" id="rateValue">--</div>
        </div>
      </div>

      <!-- 換算 -->
      <div class="conv-sec">
        <div class="conv-title">📊 ロス時間の等価換算</div>
        <div class="conv-list">
          <div class="conv-item" id="convMovie">🎬 映画 -- 本分</div>
          <div class="conv-item" id="convRamen">🍜 ラーメン -- 杯分</div>
          <div class="conv-item" id="convReflect">🧘 反省 ∞ 回</div>
        </div>
      </div>

      <!-- コメント -->
      <div class="comment-box" id="commentBox">--</div>
    </div>
  </div>

  <script>
    (function(){
      var state = {
        distance: 15,
        speed: 10,
        age: 35
      };

      var distRange = document.getElementById('distRange');
      var distLabel = document.getElementById('distLabel');
      var ageRange = document.getElementById('ageRange');
      var ageLabel = document.getElementById('ageLabel');
      var speedBtns = document.querySelectorAll('.speed-btn');

      var lossValue = document.getElementById('lossValue');
      var rateValue = document.getElementById('rateValue');
      var convMovie = document.getElementById('convMovie');
      var convRamen = document.getElementById('convRamen');
      var convReflect = document.getElementById('convReflect');
      var commentBox = document.getElementById('commentBox');

      function playBeep() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch(e){}
      }

      function updateCalc() {
        var dist = parseFloat(state.distance);
        var spd = parseFloat(state.speed);
        var age = parseFloat(state.age);

        var lossHours = (dist / spd) - (dist / 100);
        if (lossHours < 0) lossHours = 0;

        var remainingLifeHours = (80 - age) * 8760;
        var lossPct = remainingLifeHours > 0 ? (lossHours / remainingLifeHours) * 100 : 0;

        var hoursInt = Math.floor(lossHours);
        var minsInt = Math.round((lossHours - hoursInt) * 60);

        var lossStr = '';
        if (hoursInt > 0) {
          lossStr = hoursInt + '時間 ' + minsInt + '分';
        } else {
          lossStr = minsInt + '分 (' + lossHours.toFixed(2) + 'h)';
        }
        lossValue.textContent = lossStr;
        rateValue.textContent = lossPct.toFixed(6) + ' %';

        var movies = (lossHours / 2).toFixed(1);
        var ramen = Math.round(lossHours * 20);
        convMovie.textContent = '🎬 映画 ' + movies + ' 本分';
        convRamen.textContent = '🍜 ラーメン ' + ramen + ' 杯分';
        convReflect.textContent = '🧘 反省 ∞ 回';

        if (lossHours >= 3) {
          commentBox.textContent = '【大渋滞】貴重な自由時間が削り取られています';
          commentBox.style.borderLeftColor = '#ef4444';
        } else if (lossHours >= 1) {
          commentBox.textContent = '映画が1本観終わる損失です';
          commentBox.style.borderLeftColor = '#f59e0b';
        } else {
          commentBox.textContent = '軽微な損失です。安全運転で。';
          commentBox.style.borderLeftColor = '#10b981';
        }
      }

      distRange.addEventListener('input', function() {
        state.distance = distRange.value;
        distLabel.textContent = '渋滞の長さ: ' + state.distance + ' km';
        updateCalc();
      });
      distRange.addEventListener('change', playBeep);

      ageRange.addEventListener('input', function() {
        state.age = ageRange.value;
        ageLabel.textContent = 'あなたの年齢: ' + state.age + ' 歳（80歳までの残り時間基準）';
        updateCalc();
      });
      ageRange.addEventListener('change', playBeep);

      speedBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.speed = parseFloat(this.dataset.speed);
          speedBtns.forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          playBeep();
          updateCalc();
        });
      });

      updateCalc();
    })();
  </script>
</body>
</html>
