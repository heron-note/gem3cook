  <script>

  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🌊 津波浸水流・人体力学平衡アナライザー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var title=d.createElement('div');title.style.cssText='font-size:18px;font-weight:bold;color:#38bdf8;text-align:center;';title.textContent='🌊 津波浸水流・人体力学平衡アナライザー';card.appendChild(title);var subTitle=d.createElement('div');subTitle.style.cssText='font-size:12px;color:#94a3b8;text-align:center;margin-top:-6px;';subTitle.textContent='簡易力学モデルで見る水深・流速と抵抗力の減算プロセス';card.appendChild(subTitle);var ctrlGroup=d.createElement('div');ctrlGroup.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;';card.appendChild(ctrlGroup);var modeRow=d.createElement('div');modeRow.style.cssText='display:flex;gap:8px;';ctrlGroup.appendChild(modeRow);var isEbb=false;var btnPush=d.createElement('button');btnPush.style.cssText='flex:1;padding:8px;border-radius:6px;border:1px solid #38bdf8;background-color:#0284c7;color:#ffffff;font-size:13px;font-weight:bold;cursor:pointer;';btnPush.textContent='🌊 押し波（流入衝突）';modeRow.appendChild(btnPush);var btnEbb=d.createElement('button');btnEbb.style.cssText='flex:1;padding:8px;border-radius:6px;border:1px solid #334155;background-color:#1e293b;color:#94a3b8;font-size:13px;font-weight:bold;cursor:pointer;';btnEbb.textContent='↩️ 引き波（流出牽引・補正係数1.3）';modeRow.appendChild(btnEbb);btnPush.onclick=function(){isEbb=false;btnPush.style.backgroundColor='#0284c7';btnPush.style.borderColor='#38bdf8';btnPush.style.color='#ffffff';btnEbb.style.backgroundColor='#1e293b';btnEbb.style.borderColor='#334155';btnEbb.style.color='#94a3b8';calc();};btnEbb.onclick=function(){isEbb=true;btnEbb.style.backgroundColor='#0284c7';btnEbb.style.borderColor='#38bdf8';btnEbb.style.color='#ffffff';btnPush.style.backgroundColor='#1e293b';btnPush.style.borderColor='#334155';btnPush.style.color='#94a3b8';calc();};var dLabel=d.createElement('div');dLabel.style.cssText='font-size:13px;color:#cbd5e1;display:flex;justify-content:space-between;';ctrlGroup.appendChild(dLabel);var dSpanName=d.createElement('span');dSpanName.textContent='浸水深 (h)';dLabel.appendChild(dSpanName);var dSpanVal=d.createElement('span');dSpanVal.style.cssText='color:#38bdf8;font-weight:bold;';dLabel.appendChild(dSpanVal);var dSlider=d.createElement('input');dSlider.type='range';dSlider.min='0.05';dSlider.max='1.20';dSlider.step='0.01';dSlider.value='0.30';dSlider.style.cssText='width:100%;cursor:pointer;accent-color:#38bdf8;';ctrlGroup.appendChild(dSlider);var vLabel=d.createElement('div');vLabel.style.cssText='font-size:13px;color:#cbd5e1;display:flex;justify-content:space-between;';ctrlGroup.appendChild(vLabel);var vSpanName=d.createElement('span');vSpanName.textContent='実効流速 (v)';vLabel.appendChild(vSpanName);var vSpanVal=d.createElement('span');vSpanVal.style.cssText='color:#38bdf8;font-weight:bold;';vLabel.appendChild(vSpanVal);var vSlider=d.createElement('input');vSlider.type='range';vSlider.min='0.5';vSlider.max='3.5';vSlider.step='0.1';vSlider.value='1.5';vSlider.style.cssText='width:100%;cursor:pointer;accent-color:#38bdf8;';ctrlGroup.appendChild(vSlider);var monitor=d.createElement('div');monitor.style.cssText='background-color:#0f172a;border:1px solid #38bdf8;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;';card.appendChild(monitor);var statusLabel=d.createElement('div');statusLabel.style.cssText='font-size:20px;font-weight:bold;text-align:center;padding:6px;border-radius:6px;';monitor.appendChild(statusLabel);var procBox=d.createElement('div');procBox.style.cssText='display:flex;flex-direction:column;gap:6px;font-size:12px;background-color:#1e293b;padding:10px;border-radius:8px;border:1px solid #334155;';monitor.appendChild(procBox);var div1=d.createElement('div');procBox.appendChild(div1);var div2=d.createElement('div');procBox.appendChild(div2);var div3=d.createElement('div');procBox.appendChild(div3);var div4=d.createElement('div');procBox.appendChild(div4);var infoPanel=d.createElement('div');infoPanel.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;color:#cbd5e1;font-size:11px;line-height:1.6;display:flex;flex-direction:column;gap:4px;';card.appendChild(infoPanel);var exp1=d.createElement('div');exp1.style.cssText='font-weight:bold;color:#f8fafc;';exp1.textContent='【力学的視点：なぜ浸水深30cmでも危険なのか】';infoPanel.appendChild(exp1);var exp2=d.createElement('div');exp2.textContent='浸水深30cmでは大人の下肢下部が浸かる程度ですが、水没による浮力で実質接地荷重が急減し、足元の最大静止摩擦力が失われます。さらに水流の動圧は流速の2乗に比例して増大するため、抗力が摩擦限界を容易に突破し、滑動や足元支点の転倒を引き起こします。';infoPanel.appendChild(exp2);var exp3=d.createElement('div');exp3.textContent='※本ツールは人体を一様密度（1000kg/m3）・足首支点の簡易剛体と仮定した力学教育モデルです。『浸水深30cm』という数字だけを見ると軽微に感じられても、流速が加わることで浮力による接地荷重の減少と動圧による抗力の増大が同時に起こり、人体の安定性が大きく低下し得ることを示すものです。引き波時の補正は、地形勾配や局所的縮流による負荷増大を簡易的に表した教育用仮定値です。';infoPanel.appendChild(exp3);function calc(){var h=parseFloat(dSlider.value);var v=parseFloat(vSlider.value);dSpanVal.textContent=h.toFixed(2)+' m';vSpanVal.textContent=v.toFixed(1)+' m/s';var g=9.80665;var rho=1000;var rho_air=1.205;var Cd=1.20;var mu=0.40;var M=65;var L_base=0.14;var V_sub=0;var A_sub=0;if(h<=0.76){V_sub=0.0221*(h/0.76);A_sub=0.25*h;}else{var h_torso=Math.min(h,1.44)-0.76;V_sub=0.0221+0.0377*(h_torso/0.68);A_sub=(0.25*0.76)+(0.35*h_torso);}var F_buoy=rho*V_sub*g;var F_buoy_kgf=F_buoy/g;var N_eff=Math.max(0,(M*g)-F_buoy);var N_eff_kgf=N_eff/g;var F_fric=mu*N_eff;var F_fric_limit=isEbb?(F_fric/1.3):F_fric;var F_fric_limit_kgf=F_fric_limit/g;var q=0.5*rho*v*v;var F_drag=Cd*q*A_sub;var F_drag_kgf=F_drag/g;var v_air_equiv=v*Math.sqrt(rho/rho_air);var Tau_flow=F_drag*(h*0.5);var Tau_stab=N_eff*L_base;var MomentRatio=Tau_flow/Math.max(1,Tau_stab);if(MomentRatio>1.0||N_eff<=0){statusLabel.textContent='⚠️ 転倒・流失域（限界突破）';statusLabel.style.color='#f87171';statusLabel.style.backgroundColor='rgba(239,68,68,0.2)';monitor.style.borderColor='#ef4444';}else if(F_drag>F_fric_limit){statusLabel.textContent='⚠️ 滑動域（足元スライド開始）';statusLabel.style.color='#facc15';statusLabel.style.backgroundColor='rgba(234,179,8,0.2)';monitor.style.borderColor='#eab308';}else{statusLabel.textContent='🛡️ 安定域（自立保持可能）';statusLabel.style.color='#4ade80';statusLabel.style.backgroundColor='rgba(34,197,94,0.2)';monitor.style.borderColor='#22c55e';}div1.textContent='(1) 体重 '+M.toFixed(1)+' kgf - 浮力 '+F_buoy_kgf.toFixed(1)+' kgf = 残余荷重 '+N_eff_kgf.toFixed(1)+' kgf';div2.textContent='(2) 摩擦限界 '+F_fric_limit_kgf.toFixed(1)+' kgf ('+F_fric_limit.toFixed(0)+'N) vs 水流抗力 '+F_drag_kgf.toFixed(1)+' kgf ('+F_drag.toFixed(0)+'N)'+(isEbb?' [引き波補正1.3適用]':'');div3.textContent='(3) 簡易モーメント比 (転倒力/復元力): '+MomentRatio.toFixed(2);div4.textContent='(4) 等価動圧風速 (参考): 水流 '+v.toFixed(1)+' m/s = 風速 '+v_air_equiv.toFixed(1)+' m/s 相当動圧';}dSlider.oninput=calc;vSlider.oninput=calc;calc();})();
