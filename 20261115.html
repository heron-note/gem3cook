  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var state={drinks:4,pace:1};var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🍷 生化学・アルコール代謝＆二日酔い耐性アナライザー';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100vw;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;';body.appendChild(card);var title=d.createElement('div');title.style.cssText='font-size:20px;font-weight:bold;color:#f8fafc;text-align:center;margin-bottom:8px;';title.textContent='🍷 生化学・アルコール代謝＆二日酔い耐性アナライザー';card.appendChild(title);var paceLabel=d.createElement('div');paceLabel.textContent='飲酒ペース:';paceLabel.style.cssText='font-size:14px;color:#94a3b8;margin-bottom:4px;';card.appendChild(paceLabel);var paceBtnContainer=d.createElement('div');paceBtnContainer.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';var paces=[{v:0,t:'じっくり水分と交互'},{v:1,t:'標準的なハイペース'},{v:2,t:'限界知らずの一気飲み'}];var btnElements=[];for(var i=0;i<paces.length;i++){(function(p){var btn=d.createElement('button');btn.textContent=p.t;btn.style.cssText='flex:1;padding:10px;border-radius:8px;border:1px solid #475569;background-color:#334155;color:#f8fafc;cursor:pointer;font-size:14px;min-width:120px;';paceBtnContainer.app
