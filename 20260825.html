  <script>

  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🌋 ポンペイ最後の日 - 地質学的スケール判定機';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100%;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);function playBeep(){try{var AC=w.AudioContext||w.webkitAudioContext;if(!AC)return;var ctx=new AC();var osc=ctx.createOscillator();var g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(587.33,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.08);g.gain.setValueAtTime(0.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);}catch(e){}}var title=d.createElement('div');title.style.cssText='color:#f59e0b;font-size:18px;font-weight:bold;text-align:center;letter-spacing:0.5px;';title.textContent='🌋 ポンペイ最後の日・地質学的スケール判定機';card.appendChild(title);var sub=d.createElement('div');sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;line-height:1.4;';sub.textContent='地球46億年と西暦79年噴火から見る、今日のあなたの1日';card.appendChild(sub);var scaleBox=d.createElement('div');scaleBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;color:#cbd5e1;font-size:11px;line-height:1.6;display:flex;flex-direction:column;gap:4px;';var scaleT=d.createElement('div');scaleT.style.cssText='color:#38bdf8;font-weight:bold;font-size:11px;';scaleT.textContent='【 地質学的時間軸の対比 】';scaleBox.appendChild(scaleT);var l1=d.createElement('div');l1.textContent='1. 地球誕生：約46億年前（4,600,000,000年前）- 惑星形成と地殻変動の悠久史';scaleBox.appendChild(l1);var l2=d.createElement('div');l2.textContent='2. ヴェスヴィオ噴火（ポンペイ）：西暦79年8月24日（約1900年以上前）- プリニー式噴火により地層に刻まれた極微な境界線';scaleBox.appendChild(l2);var l3=d.createElement('div');l3.textContent='3. 本日の事象：0年前 - 観測限界に位置する極小の一瞬';scaleBox.appendChild(l3);card.appendChild(scaleBox);var promptLabel=d.createElement('div');promptLabel.style.cssText='color:#94a3b8;font-size:11px;font-weight:bold;margin-top:2px;';promptLabel.textContent='■ 本日の観測状態を選択：';card.appendChild(promptLabel);var btnGrid=d.createElement('div');btnGrid.style.cssText='display:grid;grid-template-columns:repeat(2,1fr);gap:8px;';card.appendChild(btnGrid);var repBox=d.createElement('div');repBox.style.cssText='background-color:#0f172a;border:1px solid #f59e0b;border-radius:10px;padding:14px;color:#fef08a;font-size:12px;line-height:1.7;min-height:110px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;';card.appendChild(repBox);var copyBtn=d.createElement('button');copyBtn.style.cssText='background-color:#0284c7;color:#ffffff;border:none;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.3);';copyBtn.textContent='📋 鑑定結果をコピー';card.appendChild(copyBtn);var items=[{id:0,label:'よくできた',state:'安定した堆積期',layer:'通常範囲の堆積を確認',judge:'異常なし。これより休息期へ移行します。'},{id:1,label:'1つだけできた',state:'微小な堆積イベント',layer:'局所的な1層を確認',judge:'異常なし。これより休息期へ移行します。'},{id:2,label:'たくさん動いた',state:'活発な変動期',layer:'広範なエネルギー消費を確認',judge:'異常なし。これより休息期へ移行します。'},{id:3,label:'何もできなかった',state:'静穏な無活動期',layer:'観測可能な変動なし',judge:'異常なし。これより休息期へ移行します。'}];var currentIdx=0;var btns=[];function renderReport(idx){currentIdx=idx;var cur=items[idx];while(repBox.firstChild){repBox.removeChild(repBox.firstChild);}var rTitle=d.createElement('div');rTitle.style.cssText='color:#f59e0b;font-weight:bold;font-size:12px;border-bottom:1px solid #334155;padding-bottom:4px;margin-bottom:2px;';rTitle.textContent='【 地質学的観測鑑定記録 】';repBox.appendChild(rTitle);var rState=d.createElement('div');rState.textContent='・ 観測状態： ' + cur.state;repBox.appendChild(rState);var rLayer=d.createElement('div');rLayer.textContent='・ 地層への影響： ' + cur.layer;repBox.appendChild(rLayer);var rJudge=d.createElement('div');rJudge.style.cssText='color:#38bdf8;font-weight:bold;';rJudge.textContent='・ 判定： ' + cur.judge;repBox.appendChild(rJudge);var rNote=d.createElement('div');rNote.style.cssText='color:#94a3b8;font-size:11px;margin-top:2px;';rNote.textContent='※ なお、休息場所として布団が推奨されます。';repBox.appendChild(rNote);for(var i=0;i<btns.length;i++){if(i===idx){btns[i].style.backgroundColor='#d97706';btns[i].style.borderColor='#f59e0b';}else{btns[i].style.backgroundColor='#334155';btns[i].style.borderColor='#475569';}}}function createSelectBtn(item,idx){var b=d.createElement('button');b.style.cssText='background-color:#334155;border:1px solid #475569;border-radius:8px;color:#ffffff;padding:8px 10px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center;box-sizing:border-box;';b.textContent=item.label;b.onclick=function(){playBeep();renderReport(idx);};btns.push(b);btnGrid.appendChild(b);}for(var j=0;j<items.length;j++){createSelectBtn(items[j],j);}copyBtn.onclick=function(){playBeep();var cur=items[currentIdx];var text='【地質学的鑑定】西暦79年8月24日ポンペイ噴火と地球46億年のスケールに照合した結果、本日の私の状態は「' + cur.state + '」と鑑定されました。判定：異常なし。これより休息期へ移行します。 #ポンペイ最後の日 #地質学的スケール判定機';if(w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){w.navigator.clipboard.writeText(text);copyBtn.textContent='✔ コピー完了！';setTimeout(function(){copyBtn.textContent='📋 鑑定結果をコピー';},1500);}else{var ta=d.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';body.appendChild(ta);ta.focus();ta.select();try{d.execCommand('copy');copyBtn.textContent='✔ コピー完了！';setTimeout(function(){copyBtn.textContent='📋 鑑定結果をコピー';},1500);}catch(e){}body.removeChild(ta);}};renderReport(0);})();
