<head>

  <title>🍜 3分間・不可逆熱湯エントロピー観測機</title>
</head>
<body>
  <script>
  // 単体HTML実行用に変換されたコード
  (function(){var w = window;var d=w.document;var head=d.head||d.getElementsByTagName('head')[0]||d.createElement('head');var body=d.body||d.getElementsByTagName('body')[0]||d.createElement('body');if(!d.head)d.documentElement.appendChild(head);if(!d.body)d.documentElement.appendChild(body);d.title='🍜 3分間・不可逆熱湯エントロピー観測機';var meta=d.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1.0';head.appendChild(meta);d.documentElement.style.cssText='margin:0;padding:0;background-color:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;';body.style.cssText='margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box;background-color:#0f172a;';var card=d.createElement('div');card.style.cssText='background-color:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);width:100%;max-width:640px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;';body.appendChild(card);var tit=d.createElement('div');tit.style.cssText='color:#f59e0b;font-size:18px;font-weight:bold;text-align:center;';tit.textContent='🍜 3分間・不可逆熱湯エントロピー観測機';card.appendChild(tit);var sub=d.createElement('div');sub.style.cssText='color:#94a3b8;font-size:12px;text-align:center;margin-top:-6px;';sub.textContent='3分間の食品物理化学変化を観測・可視化する';card.appendChild(sub);var tBox=d.createElement('div');tBox.style.cssText='background-color:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;';card.appendChild(tBox);var tDisp=d.createElement('div');tDisp.style.cssText='font-size:32px;font-weight:bold;font-family:monospace;color:#38bdf8;line-height:1;letter-spacing:2px;';tDisp.textContent='03:00';tBox.appendChild(tDisp);var pBadge=d.createElement('div');pBadge.style.cssText='color:#f59e0b;font-size:12px;font-weight:bold;text-align:center;min-height:16px;';tBox.appendChild(pBadge);var gContainer=d.createElement('div');gContainer.style.cssText='display:flex;flex-direction:column;gap:8px;';card.appendChild(gContainer);function createGRow(label,color){var row=d.createElement('div');row.style.cssText='display:flex;flex-direction:column;gap:3px;';var headDiv=d.createElement('div');headDiv.style.cssText='display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1;';var lSpan=d.createElement('span');lSpan.textContent=label;var vSpan=d.createElement('span');vSpan.style.cssText='font-family:monospace;font-weight:bold;color:'+color+';';headDiv.appendChild(lSpan);headDiv.appendChild(vSpan);var track=d.createElement('div');track.style.cssText='background-color:#0f172a;border:1px solid #334155;height:8px;border-radius:4px;overflow:hidden;position:relative;width:100%;';var bar=d.createElement('div');bar.style.cssText='height:8px;background-color:'+color+';width:0px;border-radius:4px;transition:width 0.2s linear;';track.appendChild(bar);row.appendChild(headDiv);row.appendChild(track);gContainer.appendChild(row);return {val:vSpan,track:track,bar:bar};}var g1=createGRow('多孔質浸透度（毛細管現象）','#38bdf8');var g2=createGRow('デンプン糊化度（α化度）','#10b981');var g3=createGRow('麺剛性指標','#f97316');var g4=createGRow('エントロピー指標','#a855f7');var btnRow=d.createElement('div');btnRow.style.cssText='display:flex;gap:10px;margin-top:4px;';card.appendChild(btnRow);var mainBtn=d.createElement('button');mainBtn.style.cssText='flex:2;background-color:#dc2626;color:#ffffff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:bold;cursor:pointer;outline:none;';mainBtn.textContent='♨ 熱湯注水・観測開始';btnRow.appendChild(mainBtn);var resetBtn=d.createElement('button');resetBtn.style.cssText='flex:1;background-color:#334155;color:#f8fafc;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:bold;cursor:pointer;outline:none;';resetBtn.textContent='🔄 状態リセット';btnRow.appendChild(resetBtn);var copyBtn=d.createElement('button');copyBtn.style.cssText='background-color:#0284c7;color:#ffffff;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:bold;cursor:pointer;outline:none;';copyBtn.textContent='📋 観測記録をコピー';card.appendChild(copyBtn);var note=d.createElement('div');note.style.cssText='color:#64748b;font-size:10px;text-align:center;margin-top:2px;';note.textContent='※ 本ツールの数値は即席麺の調理過程を題材にした架空のシミュレーションです。';card.appendChild(note);var t=0;var isRunning=false;var timerId=null;var actx=null;function getAudio(){if(!actx){try{var AC=w.AudioContext||w.webkitAudioContext;if(AC)actx=new AC();}catch(e){}}return actx;}function playClick(){try{var a=getAudio();if(!a)return;if(a.state==='suspended')a.resume();var o=a.createOscillator();var g=a.createGain();o.type='sine';o.frequency.setValueAtTime(800,a.currentTime);g.gain.setValueAtTime(0.05,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.05);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.05);}catch(e){}}function playChime(){try{var a=getAudio();if(!a)return;if(a.state==='suspended')a.resume();var freqs=[523.25,659.25,783.99,1046.50];for(var i=0;i<freqs.length;i++){var o=a.createOscillator();var g=a.createGain();o.type='triangle';var st=a.currentTime+i*0.12;o.frequency.setValueAtTime(freqs[i],st);g.gain.setValueAtTime(0.1,st);g.gain.exponentialRampToValueAtTime(0.001,st+0.4);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+0.4);}}catch(e){}}function render(){var rem=180-t;var m=Math.floor(rem/60);var s=rem-m*60;var ms=(m<10?'0':'')+m;var ss=(s<10?'0':'')+s;tDisp.textContent=ms+':'+ss;if(t===180){pBadge.textContent='［不可逆変化完了］不可逆熱力学変化の完了を確認。直ちに摂食フェーズへ移行せよ。';}else if(t>=151){pBadge.textContent='［終末熟成相］熱力学的準安定状態';}else if(t>=91){pBadge.textContent='［熱平衡緩和相］粘弾性の獲得';}else if(t>=31){pBadge.textContent='［不可逆糊化相］デンプン分子のα化';}else{pBadge.textContent='［初期浸潤相］多孔質への熱水侵入';}var r1=Math.sqrt(t/180);var r2=t/180;var r3=(180-t)/180;var r4=t/180;g1.val.textContent=Math.min(100,Math.floor(r1*100))+' / 100';g2.val.textContent=Math.min(100,Math.floor(r2*100))+' / 100';g3.val.textContent=Math.max(0,Math.floor(r3*100))+' / 100';g4.val.textContent=(1.0+r4*2.5).toFixed(2);var w1=g1.track.clientWidth||500;var w2=g2.track.clientWidth||500;var w3=g3.track.clientWidth||500;var w4=g4.track.clientWidth||500;g1.bar.style.width=Math.round(r1*w1)+'px';g2.bar.style.width=Math.round(r2*w2)+'px';g3.bar.style.width=Math.round(r3*w3)+'px';g4.bar.style.width=Math.round(r4*w4)+'px';if(t===0){mainBtn.textContent='♨ 熱湯注水・観測開始';mainBtn.style.backgroundColor='#dc2626';}else if(isRunning){mainBtn.textContent='⏸%EF%B8%8F 一時停止';mainBtn.style.backgroundColor='#f59e0b';}else if(t===180){mainBtn.textContent='🏁 観測完了';mainBtn.style.backgroundColor='#10b981';}else{mainBtn.textContent='▶%EF%B8%8F 観測再開';mainBtn.style.backgroundColor='#dc2626';}}function tick(){if(t<180){t++;render();if(t===180){isRunning=false;clearInterval(timerId);render();playChime();}}}mainBtn.onclick=function(){playClick();if(t>=180)return;if(isRunning){isRunning=false;clearInterval(timerId);}else{isRunning=true;timerId=setInterval(tick,1000);}render();};resetBtn.onclick=function(){playClick();isRunning=false;clearInterval(timerId);t=0;render();};copyBtn.onclick=function(){playClick();var str='【熱力学観測記録】即席麺調理における180秒の熱水浸透およびデンプンα化反応の完了を観測しました。直ちに摂食フェーズへ移行します。 #不可逆熱湯エントロピー観測機';if(w.navigator&&w.navigator.clipboard&&w.navigator.clipboard.writeText){w.navigator.clipboard.writeText(str).then(function(){var old=copyBtn.textContent;copyBtn.textContent='✅ コピー完了！';setTimeout(function(){copyBtn.textContent=old;},1500);});}else{var ta=d.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.left='-9999px';body.appendChild(ta);ta.select();d.execCommand('copy');body.removeChild(ta);var old2=copyBtn.textContent;copyBtn.textContent='✅ コピー完了！';setTimeout(function(){copyBtn.textContent=old2;},1500);}};w.onresize=function(){render();};render();})();
  </script>
